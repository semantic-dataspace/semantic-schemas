# OO-LD Schema for a Unit Process Life Cycle Inventory (UPLCI)
# Ontologies: PMDCo 3.x / OBI / IAO (backbone), DCAT + Dublin Core + PROV-O
#             (dataset metadata), QUDT (units), DSMS UPLCI vocabulary
#             (LCA-specific terms, aligned with the BONSAI core ontology)
#
# Graph pattern:
#
#   uplci:UnitProcessInventory   (⊑ iao:InformationContentEntity, dcat:Dataset)
#     rdfs:label / rdfs:comment ─────────────── name / description
#     iao:IAO_0000136 (is about) ──────────────► ManufacturingProcess KItem   (pmdco:PMD_0000833)
#     uplci:geography ──────────────────────── "DE" | "RER" | "GLO" …
#     schema:location ──────────────────────── site, free text
#     dcterms:date / dcterms:valid ─────────── compiled date / valid-until year
#     dcterms:accessRights ────────────────────► EU access-right NAL (PUBLIC | RESTRICTED | NON_PUBLIC)
#     prov:wasAttributedTo ────────────────────► expert / person KItems   (data generators)
#     dcterms:publisher ───────────────────────► organization KItem      (data owner)
#     uplci:reviewedBy ────────────────────────► expert / person KItems
#     uplci:hasInput  ─┐
#     uplci:hasOutput ─┴─► uplci:Exchange  (⊑ iao:DataItem)        [embedded, 0..N]
#         rdfs:label ─────────────────── flow name as recorded
#         uplci:hasExchangeCategory ────► uplci:MaterialInput | EnergyInput | … | ProductOutput | WasteOutput | …
#         uplci:hasFlowObject ──────────► lci-flow vocabulary term (lcif:Electricity …)
#         iao:IAO_0000136 ──────────────► Material KItem (pmdco:PMD_0000000)      optional
#         qudt:value / qudt:hasUnit ──── amount per reference flow + QUDT unit
#         uplci:isReferenceFlow ──────── true on exactly one product output
#         uplci:scalingSlope / scalingBase   linear amount model (optional)
#         uplci:hasDataDerivation ──────► uplci:Measured | Calculated | Estimated | …
#         uplci:sourceNote ──────────── provenance text
#         uplci:hasProvider ────────────► UnitProcessInventory KItem (foreground link)
#         uplci:backgroundDatabase / backgroundActivity / backgroundReferenceProduct /
#           backgroundGeography / backgroundDatasetId ── ecoinvent activity reference (flat)
#         uplci:monetaryValuePerUnit + uplci:currency + uplci:monetaryValueSource
#         uplci:climateChangePerUnit + uplci:climateChangeSource
#     uplci:hasTechnologyParameter ─────► pmdco:ParameterSpecification (PMD_0000013)  [embedded, 0..N]
#         rdf:type ─────────────────── lci-parameter vocabulary term
#         rdfs:label, qudt:value, qudt:hasUnit  (same keys as manufacturing/generic/PMDCo)
#         uplci:hasParameterCategory ───► uplci:FacilityParameter | ProcessParameter | OperationParameter
#         uplci:isScalable ─────────── xsd:boolean
#
# Design notes:
#   - The inventory is ABOUT a process; it is not the process.  The same physical
#     process KItem can be described by several inventories (other year, provider,
#     scale), and the process KItem stays reusable outside LCA.
#   - Exchanges and parameters are owned by the inventory
#     and therefore embedded.  Materials, processes, people and other inventories
#     exist independently and are linked by IRI.
#   - Process chains are NOT stored as separate link lists: they emerge from
#     `provider` links (input → supplying inventory), like default providers in
#     openLCA / ILCD.
#
# Form-builder constraints (webform-builder oold-adapter + knowledge-service
# _reconstruct_oold_from_payload) that shape this file:
#   - No internal $ref / $defs / allOf inside properties or items: they are not
#     resolved.  Every array item is an inline `type: object`.
#   - Objects nested inside array rows are supported (flattened into columns and
#     re-nested on save); arrays nested inside array rows are NOT, hence flow
#     properties are flat fields on the exchange.  The background provider is
#     flat too: the backend always restores readOnly type/id of nested objects,
#     so an optional nested object would create an empty node on every row.
#   - Array-row node IDs are generated as "<id default>_<row>", so inputs, outputs,
#     parameters and their nested objects use distinct id defaults to avoid
#     merging nodes.
#   - DSMS itself writes dcterms:created / modified / creator / identifier and
#     schema:name on every KItem; this schema uses other predicates for the
#     compilation date (dcterms:date) and data generators (prov:wasAttributedTo).

"@context":
  rdf:     "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs:    "http://www.w3.org/2000/01/rdf-schema#"
  xsd:     "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  dcat:    "http://www.w3.org/ns/dcat#"
  prov:    "http://www.w3.org/ns/prov#"
  schema:  "https://schema.org/"
  obo:     "http://purl.obolibrary.org/obo/"
  pmdco:   "https://w3id.org/pmd/co/"
  qudt:    "http://qudt.org/schema/qudt/"
  uqudt:   "http://qudt.org/vocab/unit/"
  uplci:   "https://w3id.org/dsms/uplci#"
  lcif:    "https://w3id.org/dsms/lci-flow#"
  lcip:    "https://w3id.org/dsms/lci-parameter#"
  pp:      "https://w3id.org/dsms/process-parameter#"
  accr:    "http://publications.europa.eu/resource/authority/access-right/"
  type: "@type"
  id:   "@id"
  conforms_to:
    "@id": "dcterms:conformsTo"
    "@type": "@id"
  label:
    "@id": "rdfs:label"
  description:
    "@id": "rdfs:comment"

  # ── inventory metadata ──────────────────────────────────────────────────────
  describes_process:
    "@id": "obo:IAO_0000136"          # is about
    "@type": "@id"
  geography:
    "@id": "uplci:geography"
  site:
    "@id": "schema:location"
  date_compiled:
    "@id": "dcterms:date"
    "@type": "xsd:date"
  valid_until:
    "@id": "dcterms:valid"
    "@type": "xsd:gYear"
  access_rights:
    "@id": "dcterms:accessRights"
    "@type": "@id"
  technology_readiness_level:
    "@id": "uplci:technologyReadinessLevel"
    "@type": "xsd:integer"
  data_generator:
    "@id": "prov:wasAttributedTo"
    "@type": "@id"
    "@container": "@set"
  publisher:
    "@id": "dcterms:publisher"
    "@type": "@id"
  reviewer:
    "@id": "uplci:reviewedBy"
    "@type": "@id"
    "@container": "@set"
  source:
    "@id": "dcterms:source"

  # ── exchanges ───────────────────────────────────────────────────────────────
  inputs:
    "@id": "uplci:hasInput"
    "@container": "@set"
  outputs:
    "@id": "uplci:hasOutput"
    "@container": "@set"
  category:
    "@id": "uplci:hasExchangeCategory"
    "@type": "@id"
  flow_object:
    "@id": "uplci:hasFlowObject"
    "@type": "@id"
  material:
    "@id": "obo:IAO_0000136"          # is about
    "@type": "@id"
  amount:
    "@id": "qudt:value"
    "@type": "xsd:double"
  unit:
    "@id": "qudt:hasUnit"
    "@type": "@id"
  is_reference_flow:
    "@id": "uplci:isReferenceFlow"
    "@type": "xsd:boolean"
  scaling_slope:
    "@id": "uplci:scalingSlope"
    "@type": "xsd:double"
  scaling_base:
    "@id": "uplci:scalingBase"
    "@type": "xsd:double"
  data_derivation:
    "@id": "uplci:hasDataDerivation"
    "@type": "@id"
  source_note:
    "@id": "uplci:sourceNote"
  provider:
    "@id": "uplci:hasProvider"
    "@type": "@id"
  background_database:
    "@id": "uplci:backgroundDatabase"
    "@type": "@id"
  background_activity:
    "@id": "uplci:backgroundActivity"
  background_product:
    "@id": "uplci:backgroundReferenceProduct"
  background_geography:
    "@id": "uplci:backgroundGeography"
  background_dataset_id:
    "@id": "uplci:backgroundDatasetId"
  monetary_value:
    "@id": "uplci:monetaryValuePerUnit"
    "@type": "xsd:double"
  currency:
    "@id": "uplci:currency"
  monetary_value_source:
    "@id": "uplci:monetaryValueSource"
  climate_change:
    "@id": "uplci:climateChangePerUnit"
    "@type": "xsd:double"
  climate_change_source:
    "@id": "uplci:climateChangeSource"

  # ── technology parameters (keys shared with manufacturing/generic/PMDCo) ────
  technology_parameters:
    "@id": "uplci:hasTechnologyParameter"
    "@container": "@set"
  parameter_label:
    "@id": "rdfs:label"
  parameter_type:
    "@id": "rdf:type"
    "@type": "@id"
  parameter_value:
    "@id": "qudt:value"
    "@type": "xsd:double"
  parameter_unit:
    "@id": "qudt:hasUnit"
    "@type": "@id"
  parameter_category:
    "@id": "uplci:hasParameterCategory"
    "@type": "@id"
  is_scalable:
    "@id": "uplci:isScalable"
    "@type": "xsd:boolean"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: >-
  Unit process life cycle inventory dataset (UPLCI). Information content entity
  about a pmdco:ManufacturingProcess, holding normalised input/output exchanges,
  technology parameters and dataset provenance.
x-schema-version: '0.2.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/life-cycle-assessment-unit-process-inventory-PMDCo-v0.2.0/schemas/life-cycle-assessment/unit-process-inventory/PMDCo/specs/schema.oold.generated.json'
x-maturity: 'draft'
title: Unit Process Inventory (LCI)
description: >-
  Life cycle inventory of one unit process: every input and output flow
  quantified per reference flow, the technology behind it, and who compiled it.
type: object
required:
  - type
  - id
  - label
  - geography
  - access_rights
  - outputs

properties:

  type:
    title: Type
    type: array
    items: {type: string}
    readOnly: true
    const: ["uplci:UnitProcessInventory"]
    default: ["uplci:UnitProcessInventory"]
    options:
      enum_titles: [uplci:UnitProcessInventory]

  conforms_to:
    title: Conforms To
    description: Versioned IRI of this schema; written automatically.
    type: string
    readOnly: true
    const: "https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/life-cycle-assessment-unit-process-inventory-PMDCo-v0.2.0/schemas/life-cycle-assessment/unit-process-inventory/PMDCo/specs/schema.oold.generated.json"
    default: "https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/life-cycle-assessment-unit-process-inventory-PMDCo-v0.2.0/schemas/life-cycle-assessment/unit-process-inventory/PMDCo/specs/schema.oold.generated.json"

  id:
    title: ID
    description: Identifier for this inventory; managed by the consumer.
    type: string
    readOnly: true
    default: unit-process-inventory

  label:
    title: Inventory Name
    description: e.g. "Sintering and Annealing – recycled NdFeB, IWKS 2026".
    type: string

  description:
    title: Process Description
    description: What the dataset represents, its scope and representativeness.
    type: string
    format: textarea

  describes_process:
    title: Process
    description: The manufacturing process this inventory is about.
    type: string
    format: kitem
    x-kitem:
      ktypeIds: [manufacturing-process]

  geography:
    title: Geography
    description: ISO 3166-1 alpha-2 country code (DE) or ecoinvent region (RER, GLO, RoW).
    type: string
    minLength: 2
    default: DE

  site:
    title: Site
    description: Location of the plant or lab, free text (e.g. "Hanau").
    type: string

  date_compiled:
    title: Date of Compilation
    type: string
    format: date

  valid_until:
    title: Valid Until (Year)
    type: string
    pattern: "^[0-9]{4}$"

  access_rights:
    title: Access Rights
    description: Confidentiality of the dataset (EU access-right vocabulary).
    type: string
    enum:
      - "accr:PUBLIC"
      - "accr:RESTRICTED"
      - "accr:NON_PUBLIC"
    options:
      enum_titles: [public, restricted, confidential]

  technology_readiness_level:
    title: TRL
    type: integer
    minimum: 1
    maximum: 9

  data_generator:
    title: Data Generator(s)
    description: Persons who compiled the data.
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [expert]
    items: {type: string, format: uri}
    uniqueItems: true
    default: []

  publisher:
    title: Data Owner
    description: Organisation that provides and owns the data.
    type: string
    format: kitem
    x-kitem:
      ktypeIds: [organization]

  reviewer:
    title: Reviewer(s)
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [expert]
    items: {type: string, format: uri}
    uniqueItems: true
    default: []

  source:
    title: Data Collection / Source
    description: Project or data collection the values come from (e.g. "IWKS W4F Project").
    type: string

  # ── Inputs ─────────────────────────────────────────────────────────────────
  inputs:
    title: Inputs
    description: Materials, energy, personnel and services entering the process, per reference flow.
    type: array
    items:
      type: object
      title: Input
      required: [type, id, label, category, amount, unit]
      properties:
        type:
          title: Type
          type: array
          items: {type: string}
          readOnly: true
          const: ["uplci:Exchange"]
          default: ["uplci:Exchange"]
        id:
          title: ID
          type: string
          readOnly: true
          default: input
        label:
          title: Flow Name
          description: Name as recorded (e.g. "Pressling", "Wärmeenergie").
          type: string
        category:
          title: Category
          type: string
          enum:
            - "uplci:MaterialInput"
            - "uplci:EnergyInput"
            - "uplci:PersonnelInput"
            - "uplci:ServiceInput"
            - "uplci:NaturalResourceInput"
          options:
            enum_titles: [material, energy, personnel, service / generic flow, natural resource]
        flow_object:
          title: Flow Type
          description: What flows (lci-flow vocabulary), e.g. Electricity, Argon.
          type: string
          x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/lci-flow/use-cases/all/terms"
        material:
          title: Material
          description: Material KItem this flow consists of (tracked intermediate products).
          type: string
          format: kitem
          x-kitem:
            ktypeIds: [material]
        amount:
          title: Amount
          description: Quantity per reference flow.
          type: number
        unit:
          title: Unit
          type: string
          x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/measurement-unit/use-cases/base/terms"
        description:
          title: Specification
          description: Quality, supply chain, supplier location, transport …
          type: string
        data_derivation:
          title: Data Derivation
          type: string
          enum:
            - "uplci:Measured"
            - "uplci:Calculated"
            - "uplci:Estimated"
            - "uplci:Assumed"
            - "uplci:FromLiterature"
            - "uplci:MachineSetting"
            - "uplci:UnknownDerivation"
          options:
            enum_titles: [measured, calculated, estimated, assumption, literature, machine setting, unknown]
        source_note:
          title: Source / Note
          description: Calculation path, literature, uncertainty, assumption.
          type: string
        scaling_slope:
          title: Scaling Slope
          description: Scalable part (amount = slope × reference amount + base).
          type: number
        scaling_base:
          title: Scaling Base
          description: Fixed, non-scalable part of the amount.
          type: number
        provider:
          title: Foreground Provider
          description: Inventory whose output supplies this input. Defines the process chain.
          type: string
          format: kitem
          x-kitem:
            ktypeIds: [unit-process-inventory]
        background_database:
          title: Background Database
          description: Background database of the activity supplying this input (use instead of a foreground provider).
          type: string
          enum:
            - "uplci:Ecoinvent_3_8_Cutoff"
            - "uplci:Ecoinvent_3_8_APOS"
            - "uplci:Ecoinvent_3_8_Consequential"
            - "uplci:Ecoinvent_3_9_1_Cutoff"
            - "uplci:Ecoinvent_3_9_1_APOS"
            - "uplci:Ecoinvent_3_9_1_Consequential"
            - "uplci:Ecoinvent_3_10_Cutoff"
            - "uplci:Ecoinvent_3_10_APOS"
            - "uplci:Ecoinvent_3_10_Consequential"
          options:
            enum_titles:
              - ecoinvent 3.8 cut-off
              - ecoinvent 3.8 APOS
              - ecoinvent 3.8 consequential
              - ecoinvent 3.9.1 cut-off
              - ecoinvent 3.9.1 APOS
              - ecoinvent 3.9.1 consequential
              - ecoinvent 3.10 cut-off
              - ecoinvent 3.10 APOS
              - ecoinvent 3.10 consequential
        background_activity:
          title: Background Activity
          description: Activity name in the background database, e.g. "market for electricity, medium voltage".
          type: string
        background_product:
          title: Background Reference Product
          type: string
        background_geography:
          title: Background Geography
          type: string
        background_dataset_id:
          title: Background Dataset ID
          description: Activity UUID (or activity_product UUID pair).
          type: string
        monetary_value:
          title: Cost per Unit
          description: Cost or market price per unit of the flow.
          type: number
        currency:
          title: Currency
          description: ISO 4217 code, e.g. EUR.
          type: string
          pattern: "^[A-Z]{3}$"
        monetary_value_source:
          title: Cost Source
          type: string
        climate_change:
          title: Climate Change per Unit (kg CO2-eq)
          description: Cumulative climate change impact per unit of the flow.
          type: number
        climate_change_source:
          title: Climate Change Source
          description: e.g. "ecoinvent 3.8 consequential, EF 3.0".
          type: string
    default: []

  # ── Outputs ────────────────────────────────────────────────────────────────
  outputs:
    title: Outputs
    description: Products, co-products, wastes and emissions leaving the process, per reference flow.
    type: array
    minItems: 1
    items:
      type: object
      title: Output
      required: [type, id, label, category, amount, unit]
      properties:
        type:
          title: Type
          type: array
          items: {type: string}
          readOnly: true
          const: ["uplci:Exchange"]
          default: ["uplci:Exchange"]
        id:
          title: ID
          type: string
          readOnly: true
          default: output
        label:
          title: Flow Name
          description: Name as recorded (e.g. "Sintermagnet", "Schleifschlamm").
          type: string
        category:
          title: Category
          type: string
          enum:
            - "uplci:ProductOutput"
            - "uplci:CoProductOutput"
            - "uplci:WasteOutput"
            - "uplci:EmissionOutput"
            - "uplci:OtherOutput"
          options:
            enum_titles: [product, co-product / valuable by-product, waste / loss, emission, other]
        is_reference_flow:
          title: Reference Flow
          description: Tick for the one product output all amounts refer to.
          type: boolean
        flow_object:
          title: Flow Type
          description: What flows (lci-flow vocabulary), e.g. Metal scrap, Argon (to air).
          type: string
          x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/lci-flow/use-cases/all/terms"
        material:
          title: Material
          description: Material KItem this flow consists of (products, recyclable residues).
          type: string
          format: kitem
          x-kitem:
            ktypeIds: [material]
        amount:
          title: Amount
          description: Quantity per reference flow.
          type: number
        unit:
          title: Unit
          type: string
          x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/measurement-unit/use-cases/base/terms"
        description:
          title: Specification
          description: Hazard class, destination, planned treatment …
          type: string
        data_derivation:
          title: Data Derivation
          type: string
          enum:
            - "uplci:Measured"
            - "uplci:Calculated"
            - "uplci:Estimated"
            - "uplci:Assumed"
            - "uplci:FromLiterature"
            - "uplci:MachineSetting"
            - "uplci:UnknownDerivation"
          options:
            enum_titles: [measured, calculated, estimated, assumption, literature, machine setting, unknown]
        source_note:
          title: Source / Note
          type: string
        scaling_slope:
          title: Scaling Slope
          type: number
        scaling_base:
          title: Scaling Base
          type: number
        provider:
          title: Treatment Provider
          description: Inventory in this DSMS that treats this waste output (optional).
          type: string
          format: kitem
          x-kitem:
            ktypeIds: [unit-process-inventory]
        background_database:
          title: Background Treatment Database
          description: Background database of the activity treating this output (use instead of a foreground provider).
          type: string
          enum:
            - "uplci:Ecoinvent_3_8_Cutoff"
            - "uplci:Ecoinvent_3_8_APOS"
            - "uplci:Ecoinvent_3_8_Consequential"
            - "uplci:Ecoinvent_3_9_1_Cutoff"
            - "uplci:Ecoinvent_3_9_1_APOS"
            - "uplci:Ecoinvent_3_9_1_Consequential"
            - "uplci:Ecoinvent_3_10_Cutoff"
            - "uplci:Ecoinvent_3_10_APOS"
            - "uplci:Ecoinvent_3_10_Consequential"
          options:
            enum_titles:
              - ecoinvent 3.8 cut-off
              - ecoinvent 3.8 APOS
              - ecoinvent 3.8 consequential
              - ecoinvent 3.9.1 cut-off
              - ecoinvent 3.9.1 APOS
              - ecoinvent 3.9.1 consequential
              - ecoinvent 3.10 cut-off
              - ecoinvent 3.10 APOS
              - ecoinvent 3.10 consequential
        background_activity:
          title: Background Activity
          description: Activity name in the background database, e.g. "market for electricity, medium voltage".
          type: string
        background_product:
          title: Background Reference Product
          type: string
        background_geography:
          title: Background Geography
          type: string
        background_dataset_id:
          title: Background Dataset ID
          description: Activity UUID (or activity_product UUID pair).
          type: string
        monetary_value:
          title: Value per Unit
          description: Revenue (or disposal cost, negative) per unit of the flow.
          type: number
        currency:
          title: Currency
          type: string
          pattern: "^[A-Z]{3}$"
        monetary_value_source:
          title: Value Source
          type: string
        climate_change:
          title: Climate Change per Unit (kg CO2-eq)
          type: number
        climate_change_source:
          title: Climate Change Source
          type: string
    default: []

  # ── Technology parameters ──────────────────────────────────────────────────
  technology_parameters:
    title: Technology Parameters
    description: Facility, process and operation parameters behind the inventory.
    type: array
    items:
      type: object
      title: Parameter
      required: [type, id, parameter_label, parameter_category]
      properties:
        type:
          title: Type
          type: array
          items: {type: string}
          readOnly: true
          const: ["pmdco:PMD_0000013"]
          default: ["pmdco:PMD_0000013"]
          options:
            enum_titles: [pmdco:ParameterSpecification]
        id:
          title: ID
          type: string
          readOnly: true
          default: parameter
        parameter_label:
          title: Parameter Name
          description: Name as recorded (e.g. "Prozessdauer").
          type: string
        parameter_type:
          title: Parameter Type
          description: Search and select a parameter type (lci-parameter vocabulary).
          type: string
          x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/lci-parameter/use-cases/all/terms"
        parameter_category:
          title: Category
          type: string
          enum: ["uplci:FacilityParameter", "uplci:ProcessParameter", "uplci:OperationParameter"]
          options:
            enum_titles: [facility, process, operation]
        parameter_value:
          title: Value
          type: number
        parameter_unit:
