# OO-LD Schema for a Life Cycle Assessment Run (evaluation result)
# Ontologies: OBI (data transformation), IAO, PROV-O, DSMS UPLCI vocabulary
#
# Graph pattern:
#
#   uplci:LifeCycleAssessmentRun   (⊑ obi:DataTransformation OBI_0200000)
#     rdfs:label / rdfs:comment ─────────── name / description
#     dcterms:date ─────────────────────── when the evaluation ran
#     obi:OBI_0000293 (has specified input) ──► ProductSystem KItem(s)
#     raw_result → obi:OBI_0000299 ───────────► Dataset KItem holding the raw service response (optional)
#     uplci:recommendedPathwayName ─────── name of the best pathway
#     uplci:recommendsStep ────────────────► UnitProcessInventory KItems on the recommended pathway
#     results → obi:OBI_0000299 ──────────────► uplci:IndicatorResult (⊑ iao:DataItem)   [embedded, 1..N]
#         rdfs:label ─────────────── indicator name as reported
#         uplci:hasIndicator ─────────► lca-indicator vocabulary term (lcai:ClimateChangeTotal, lcai:EBIT …)
#         obi:OBI_0001938 ────────────► obi:ScalarValueSpecification
#             obi:OBI_0001937 ── value, iao:IAO_0000039 ─► QUDT unit (if one exists)
#             uplci:unitText ─── unit as reported ("kg CO2-eq", "Euro")
#         uplci:bestValue ─────────── best value over all evaluated pathways
#
# Design notes:
#   - Same structural pattern as characterization/generic/PMDCo: KItem links via
#     has_specified_input/output, embedded result data items via OBI_0000299.
#   - Indicator names differ between projects (GWP, EBIT, SCE …), so indicators
#     are vocabulary terms, never hard-coded fields.

"@context":
  rdfs:    "http://www.w3.org/2000/01/rdf-schema#"
  xsd:     "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  obo:     "http://purl.obolibrary.org/obo/"
  uqudt:   "http://qudt.org/vocab/unit/"
  uplci:   "https://w3id.org/dsms/uplci/"
  lcai:    "https://w3id.org/dsms/lca-indicator/"
  type: "@type"
  id:   "@id"
  conforms_to:
    "@id": "dcterms:conformsTo"
    "@type": "@id"
  label:
    "@id": "rdfs:label"
  description:
    "@id": "rdfs:comment"
  date:
    "@id": "dcterms:date"
    "@type": "xsd:dateTime"
  has_specified_input:
    "@id": "obo:OBI_0000293"
    "@type": "@id"
    "@container": "@set"
  raw_result:
    "@id": "obo:OBI_0000299"
    "@type": "@id"
    "@container": "@set"
  results:
    "@id": "obo:OBI_0000299"
    "@container": "@set"
  recommended_pathway_name:
    "@id": "uplci:recommendedPathwayName"
  recommended_steps:
    "@id": "uplci:recommendsStep"
    "@type": "@id"
    "@container": "@set"
  indicator:
    "@id": "uplci:hasIndicator"
    "@type": "@id"
  value:
    "@id": "obo:OBI_0001938"
  numeric_value:
    "@id": "obo:OBI_0001937"
    "@type": "xsd:double"
  unit:
    "@id": "obo:IAO_0000039"
    "@type": "@id"
  unit_text:
    "@id": "uplci:unitText"
  best_value:
    "@id": "uplci:bestValue"
    "@type": "xsd:double"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: >-
  A life cycle assessment run (OBI data transformation) evaluating a product
  system and reporting indicator results.
x-schema-version: '0.1.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/life-cycle-assessment-assessment-PMDCo-v0.1.0/schemas/life-cycle-assessment/assessment/PMDCo/specs/schema.oold.generated.json'
x-maturity: 'draft'
x-process-step:
  category: data-analysis
title: LCA Assessment Run
description: >-
  One evaluation of a product system by an LCA tool or service (e.g. MPPM):
  settings used, recommended pathway and indicator results.
type: object
required: [type, id, label, has_specified_input, results]

properties:

  type:
    title: Type
    type: array
    items: {type: string}
    readOnly: true
    const: ["uplci:LifeCycleAssessmentRun"]
    default: ["uplci:LifeCycleAssessmentRun"]
    options:
      enum_titles: [uplci:LifeCycleAssessmentRun]

  conforms_to:
    title: Conforms To
    description: Versioned IRI of this schema; written automatically.
    type: string
    readOnly: true
    const: "https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/life-cycle-assessment-assessment-PMDCo-v0.1.0/schemas/life-cycle-assessment/assessment/PMDCo/specs/schema.oold.generated.json"
    default: "https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/life-cycle-assessment-assessment-PMDCo-v0.1.0/schemas/life-cycle-assessment/assessment/PMDCo/specs/schema.oold.generated.json"

  id:
    title: ID
    type: string
    readOnly: true
    default: lca-run

  label:
    title: Name
    type: string

  description:
    title: Description
    type: string
    format: textarea

  date:
    title: Run Date / Time
    type: string
    format: date-time

  has_specified_input:
    title: Product System(s)
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [lca-product-system]
    items: {type: string, format: uri}
    uniqueItems: true
    minItems: 1

  raw_result:
    title: Raw Result Dataset
    description: Dataset KItem holding the unmodified service response (e.g. MPPM JSON).
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [dataset]
    items: {type: string, format: uri}
    uniqueItems: true
    default: []

  recommended_pathway_name:
    title: Recommended Pathway
    type: string

  recommended_steps:
    title: Recommended Pathway Steps
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [unit-process-inventory]
    items: {type: string, format: uri}
    uniqueItems: true
    default: []

  results:
    title: Indicator Results
    type: array
    minItems: 1
    items:
      type: object
      required: [type, id, indicator, value]
      properties:
        type:
          type: array
          items: {type: string}
          readOnly: true
          const: ["uplci:IndicatorResult"]
          default: ["uplci:IndicatorResult"]
        id:
          type: string
          readOnly: true
          default: result
        label:
          title: Name as Reported
          type: string
        indicator:
          title: Indicator
          type: string
          # Temporary: "base" instead of "all". The deployed vocabulary service treats
          # "all" literally for mutable namespaces and returns no terms; switch back to
          # "all" once the service with the all=null alias is deployed.
          x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/lca-indicator/use-cases/base/terms"
        value:
          title: Value
          type: object
          required: [type, id, numeric_value]
          properties:
            type:
              type: array
              items: {type: string}
              readOnly: true
              const: ["obo:OBI_0001931"]
              default: ["obo:OBI_0001931"]
            id:
              type: string
              readOnly: true
              default: result-value
            numeric_value:
              title: Value
              type: number
            unit:
              title: Unit (QUDT)
              type: string
              x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/measurement-unit/use-cases/base/terms"
            unit_text:
              title: Unit as Reported
              type: string
        best_value:
          title: Best Value (all pathways)
          type: number
