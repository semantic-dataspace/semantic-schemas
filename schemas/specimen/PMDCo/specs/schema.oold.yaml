# OO-LD Schema for Specimen (PMDCo duality object/material pattern)
# Ontology: Platform MaterialDigital Core Ontology (PMDCo)
#   https://w3id.org/pmd/co/
#
# PMDCo patterns:
#
#   1. Duality Object / Material
#      https://github.com/materialdigital/core-ontology/tree/main/patterns/duality%20object%20material
#      → Specimen is a bfo:Object linked to an existing Material entity (kitem IRI).
#        Chemical composition is a quality of the Material and is recorded in the
#        Material's own knowledge-graph node; it is not embedded here.
#
#   2. Material Property (Quality)
#      https://github.com/materialdigital/core-ontology/tree/main/patterns/material%20property%20(quality)
#      → Mass quality with ScalarValueSpecification (OBI_0001931).
#
# Graph pattern:
#
#   Specimen  (bfo:BFO_0000030, Object)
#     rdfs:label ──────────────────────────────────────── name string
#     has_quality ────────────────────────────────────► Mass (PMD_0020133)  [optional]
#       quality_of ──────────────────────────────────── Specimen ← back-ref
#       specified_by_value ─────────────────────────► ScalarValueSpecification (OBI_0001931)
#         has_specified_numeric_value ─────────────── xsd:double
#         has_measurement_unit_label ──────────────── unit IRI  (g · kg · mg)
#     schema:material ────────────────────────────────► Material IRI  [optional, kitem]
#     prov:wasDerivedFrom ────────────────────────────► Semi-finished product IRI  [optional, kitem]
#       The abstract material identity is also accessible transitively via
#       semi-finished-product's own schema:material link. When source is set,
#       the UI should offer to auto-populate schema:material from source.made_of.

"@context":
  obo: "http://purl.obolibrary.org/obo/"
  bfo:
    "@id": "http://purl.obolibrary.org/obo/BFO_"
    "@prefix": true
  ro:
    "@id": "http://purl.obolibrary.org/obo/RO_"
    "@prefix": true
  obi:
    "@id": "http://purl.obolibrary.org/obo/OBI_"
    "@prefix": true
  iao:
    "@id": "http://purl.obolibrary.org/obo/IAO_"
    "@prefix": true
  uo:
    "@id": "http://purl.obolibrary.org/obo/UO_"
    "@prefix": true
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  pmdco: "https://w3id.org/pmd/co/"
  schema: "https://schema.org/"
  conforms_to:
    "@id": "http://purl.org/dc/terms/conformsTo"
    "@type": "@id"
  type: "@type"
  id: "@id"
  label:
    "@id": "rdfs:label"
  mass:
    "@id": "ro:0000086"   # RO_0000086  has_quality  (mass quality)
    "@type": "@id"
  quality_of:
    "@id": "ro:0000080"   # RO_0000080  quality_of
    "@type": "@id"
  specified_by_value:
    "@id": "pmdco:PMD_0000077"
    "@type": "@id"
  value:
    "@id": "obi:0001937"  # OBI_0001937  has_specified_numeric_value
    "@type": "xsd:double"
  unit:
    "@id": "iao:0000039"  # IAO_0000039  has_measurement_unit_label
    "@type": "@id"
  material:
    "@id": "schema:material"
    "@type": "@id"
  source:
    "@id": "http://www.w3.org/ns/prov#wasDerivedFrom"
    "@type": "@id"
  "@base": "https://example.org/"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: >-
  Schema for a bfo:Object (Specimen) bearing an optional PMDCo Mass quality,
  linked to an optional Material entity via schema:material (PMDCo duality pattern),
  and optionally to the specific semi-finished product it was prepared from via
  prov:wasDerivedFrom. When source is set, schema:material can be derived from
  source.made_of; the UI should offer to populate it automatically.
x-schema-version: '0.3.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/specimen-PMDCo-v0.3.0/schemas/specimen/PMDCo/specs/schema.oold.yaml'
x-maturity: 'draft'
title: Specimen
type: object
required:
  - type
  - id
  - label

properties:

  type:
    title: Type
    type: string
    readOnly: true
    const: "bfo:0000030"
    default: "bfo:0000030"
    options:
      enum_titles:
        - bfo:Object

  id:
    title: ID
    description: Identifier for this specimen instance; managed by the consumer.
    type: string
    readOnly: true
    default: specimen

  label:
    title: Specimen Name
    description: >-
      Human-readable name or identifier for this specimen
      (e.g. "316L tensile bar #1").
    type: string

  mass:
    title: Mass
    description: >-
      The mass of this specimen, modelled as a PMDCo Mass quality
      (PMD_0020133) with a ScalarValueSpecification.
    type: object
    required:
      - type
      - id
      - quality_of
      - specified_by_value
    properties:
      type:
        title: Type
        type: string
        readOnly: true
        const: "pmdco:PMD_0020133"
        default: "pmdco:PMD_0020133"
        options:
          enum_titles:
            - pmdco:Mass
      id:
        title: ID
        description: Identifier for this mass quality instance; managed by the consumer.
        type: string
        readOnly: true
        default: mass
      quality_of:
        title: Quality Of
        description: Back-reference to the specimen this mass is a quality of.
        type: string
        readOnly: true
        $comment: Must match the root specimen id; set by the consumer.
      specified_by_value:
        title: Scalar Value
        description: A ScalarValueSpecification carrying the numeric mass value and its unit.
        type: object
        required:
          - type
          - id
          - value
          - unit
        properties:
          type:
            title: Type
            type: string
            readOnly: true
            const: "obi:0001931"
            default: "obi:0001931"
            options:
              enum_titles:
                - obi:ScalarValueSpecification
          id:
            title: ID
            description: Identifier for this value specification; managed by the consumer.
            type: string
            readOnly: true
            default: mass-svs
          value:
            title: Mass Value
            description: Numeric mass of the specimen.
            type: number
            minimum: 0
          unit:
            title: Unit
            description: Unit of the mass value.
            type: string
            enum:
              - "uo:0000021"
              - "uo:0000022"
              - "uo:0000023"
            default: "uo:0000021"
            options:
              enum_titles:
                - gram (g)
                - kilogram (kg)
                - milligram (mg)

  material:
    title: Material
    description: >-
      Abstract alloy or substance identity of this specimen, following the PMDCo
      duality object/material pattern. Links to a material k-item carrying
      composition and designation data. Can be auto-populated from source.made_of
      when source is set.
    x-kitem:
      ktypeIds: ["material"]
    type: string
    format: uri

  source:
    title: Source
    description: >-
      The specific semi-finished product (e.g. metal sheet) this specimen was
      cut or prepared from. Links to a semi-finished-product k-item carrying
      physical provenance such as lot number, supplier, and dimensions.
    x-kitem:
      ktypeIds: ["semi-finished-product"]
    type: string
    format: uri
