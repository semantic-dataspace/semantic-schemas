# OO-LD Schema for Specimen (PMDCo TemporallyQualifiedContinuant pattern)
# Ontology: Platform MaterialDigital Core Ontology (PMDCo)
#   https://w3id.org/pmd/co/
#
# PMDCo pattern: TemporallyQualifiedContinuant / Duality Object–Material
#   The Specimen KItem IS a TemporallyQualifiedContinuant (TQC) — a temporal
#   state of the abstract Material entity.
#
# Graph pattern (matches rolling-process example):
#
#   Specimen (TQC)  a  bfo:BFO_0000030, pmdco:PMD_0000068
#     is_state_of (PMD_0000070) ─────► Material KItem
#     exists_at   (BFO_0000108) ─────► TemporalRegion (BFO_0000008)
#     has_quality (RO_0000086)  ─────► Thickness quality (PMD_0050153)
#       inheres_in (RO_0000052) ────── Specimen ← back-ref
#       specified_by_value (PMD_0000077) ─► ScalarValueSpec (OBI_0001931)
#         has_numeric_value (OBI_0001937)   xsd:double
#         has_unit_label    (IAO_0000039)   unit IRI
#     has_quality (RO_0000086)  ─────► Width quality (PMD_0050154)
#     has_quality (RO_0000086)  ─────► Length quality (PMD_0040001)
#     has_quality (RO_0000086)  ─────► Diameter quality (PMD_0050051)
#     has_quality (RO_0000086)  ─────► Mass quality (PMD_0020133)
#     has_quality (RO_0000086)  ─────► SurfaceRoughnessRa (dsms:SurfaceRoughnessRa)
#     has_quality (RO_0000086)  ─────► SurfaceRoughnessRq (dsms:SurfaceRoughnessRq)
#     prov:wasDerivedFrom ───────────► semi-finished-product KItem
#     dsms:temporalState ────────────  "pre-test" | "post-test" | "as-received"
#     dsms:hasSurfacePreparation ────  text
#     dsms:hasSpecimenForm ──────────  text enum
#
# State-change SPARQL:
#   SELECT ?process ?pre ?post ?material WHERE {
#     ?process obi:OBI_0000293 ?pre ;
#              obi:OBI_0000299 ?post .
#     ?pre  pmdco:PMD_0000070 ?material .
#     ?post pmdco:PMD_0000070 ?material .
#   }

"@context":
  obo:     "http://purl.obolibrary.org/obo/"
  bfo:
    "@id": "http://purl.obolibrary.org/obo/BFO_"
    "@prefix": true
  ro:
    "@id": "http://purl.obolibrary.org/obo/RO_"
    "@prefix": true
  obi:
    "@id": "http://purl.obolibrary.org/obo/OBI_"
    "@prefix": true
  iao:
    "@id": "http://purl.obolibrary.org/obo/IAO_"
    "@prefix": true
  uo:
    "@id": "http://purl.obolibrary.org/obo/UO_"
    "@prefix": true
  rdfs:    "http://www.w3.org/2000/01/rdf-schema#"
  xsd:     "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  pmdco:   "https://w3id.org/pmd/co/"
  dspec:   "https://w3id.org/dsms/specimen#"

  conforms_to:
    "@id": "http://purl.org/dc/terms/conformsTo"
    "@type": "@id"
  type: "@type"
  id: "@id"
  label:
    "@id": "rdfs:label"

  # PMDCo state relations
  material:
    "@id": "pmdco:PMD_0000070"   # is_state_of
    "@type": "@id"
  exists_at:
    "@id": "bfo:0000108"          # BFO_0000108  exists_at
    "@type": "@id"

  # Quality relations (all qualities link via has_quality)
  # Multiple JSON keys map to same IRI — produces multiple triples, one per quality type
  thickness_quality:
    "@id": "ro:0000086"           # RO_0000086  has_quality
    "@type": "@id"
  width_quality:
    "@id": "ro:0000086"
    "@type": "@id"
  length_quality:
    "@id": "ro:0000086"
    "@type": "@id"
  diameter_quality:
    "@id": "ro:0000086"
    "@type": "@id"
  mass_quality:
    "@id": "ro:0000086"
    "@type": "@id"
  roughness_ra:
    "@id": "ro:0000086"
    "@type": "@id"
  roughness_rq:
    "@id": "ro:0000086"
    "@type": "@id"

  # Quality node internals (shared across all quality objects via context inheritance)
  inheres_in:
    "@id": "ro:0000052"           # RO_0000052  inheres_in  (quality → bearer back-ref)
    "@type": "@id"
  specified_by_value:
    "@id": "pmdco:PMD_0000077"    # PMD_0000077  specified_by_value
    "@type": "@id"
  value:
    "@id": "obi:0001937"          # OBI_0001937  has_specified_numeric_value
    "@type": "xsd:double"
  unit:
    "@id": "iao:0000039"          # IAO_0000039  has_measurement_unit_label
    "@type": "@id"

  # Provenance
  source:
    "@id": "http://www.w3.org/ns/prov#wasDerivedFrom"
    "@type": "@id"

  # DSMS specimen metadata
  temporal_state:
    "@id": "dspec:temporalState"
  surface_preparation:
    "@id": "dspec:hasSurfacePreparation"
  specimen_form:
    "@id": "dspec:hasSpecimenForm"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: >-
  PMDCo TemporallyQualifiedContinuant schema for a specimen state.
  Geometry (thickness, width, length, diameter), mass, and surface roughness
  are modelled as PMDCo quality nodes (has_quality → quality class → specified_by_value).
  State change is demonstrated by linking pre-test and post-test specimens
  sharing the same material (is_state_of) through a process.
x-schema-version: '0.6.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/kiran/schemas/specimen/PMDCo/specs/schema.oold.yaml'
x-maturity: 'draft'
title: Specimen
type: object
required:
  - type
  - id
  - label

properties:

  # ── Root types ────────────────────────────────────────────────────────────

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["bfo:0000030", "pmdco:PMD_0000068"]
    default: ["bfo:0000030", "pmdco:PMD_0000068"]
    options:
      enum_titles:
        - bfo:Object
        - pmdco:TemporallyQualifiedContinuant

  id:
    title: ID
    description: Identifier for this specimen instance; managed by the consumer.
    type: string
    readOnly: true
    default: specimen

  label:
    title: Specimen Name
    description: "Human-readable name, e.g. '316L bar #1 — pre-test'"
    type: string

  # ── PMDCo state pattern ────────────────────────────────────────────────────

  material:
    title: Material (is_state_of)
    description: >-
      Abstract material identity this specimen is a state of (PMD_0000070).
      Pre-test and post-test specimens of the same material both link here,
      enabling state-change SPARQL.
    type: string
    format: kitem
    x-kitem:
      ktypeIds: [material]

  exists_at:
    title: Exists At (Temporal Region)
    description: >-
      Temporal region during which this specimen exists in this state (BFO_0000108).
      Pre-test and post-test specimens have distinct temporal regions.
    type: object
    required:
      - type
      - id
    properties:
      type:
        title: Type
        type: array
        items: {type: string}
        readOnly: true
        const: ["bfo:0000008"]
        default: ["bfo:0000008"]
        options:
          enum_titles:
            - bfo:TemporalRegion
      id:
        title: Temporal Region ID
        type: string
        readOnly: true
        default: temporal-region
      label:
        title: Description
        description: "e.g. 'before nanoindentation', 'after sawing'"
        type: string

  temporal_state:
    title: Temporal State
    description: "Controlled lifecycle label: as-received, pre-test, or post-test."
    type: string
    enum:
      - as-received
      - pre-test
      - post-test

  # ── Provenance ─────────────────────────────────────────────────────────────

  source:
    title: Source
    description: Semi-finished product this specimen was cut from (prov:wasDerivedFrom).
    type: string
    format: kitem
    x-kitem:
      ktypeIds: [semi-finished-product]

  # ── Geometry quality nodes ─────────────────────────────────────────────────
  # Pattern: specimen -has_quality (RO_0000086)-> quality_node
  #          quality_node -inheres_in (RO_0000052)-> specimen  [back-ref, readOnly]
  #          quality_node -specified_by_value (PMD_0000077)-> ScalarValueSpec
  # Use whichever dimensions apply to the specimen form.

  thickness_quality:
    title: Thickness
    description: Thickness of the specimen (PMDCo PMD_0050153).
    type: object
    required:
      - type
      - id
      - specified_by_value
    properties:
      type:
        title: Type
        type: array
        items: {type: string}
        readOnly: true
        const: ["pmdco:PMD_0050153"]
        default: ["pmdco:PMD_0050153"]
        options:
          enum_titles:
            - pmdco:Thickness
      id:
        title: ID
        type: string
        readOnly: true
        default: thickness-quality
      inheres_in:
        title: Inheres In
        description: Back-reference to this specimen instance.
        type: string
        readOnly: true
        $comment: "Resolved from root.id"
      specified_by_value:
        title: Value Specification
        type: object
        required: [type, id, value, unit]
        properties:
          type:
            title: Type
            type: array
            items: {type: string}
            readOnly: true
            const: ["obi:0001931"]
            default: ["obi:0001931"]
            options:
              enum_titles:
                - obi:ScalarValueSpecification
          id:
            title: ID
            type: string
            readOnly: true
            default: thickness-svs
          value:
            title: Value
            type: number
            minimum: 0
          unit:
            title: Unit
            type: string
            enum:
              - "obo:UO_0000015"   # mm
              - "obo:UO_0000017"   # µm
            default: "obo:UO_0000015"
            options:
              enum_titles:
                - mm (millimetre)
                - µm (micrometre)

  width_quality:
    title: Width
    description: Width of the specimen (PMDCo PMD_0050154).
    type: object
    required:
      - type
      - id
      - specified_by_value
    properties:
      type:
        title: Type
        type: array
        items: {type: string}
        readOnly: true
        const: ["pmdco:PMD_0050154"]
        default: ["pmdco:PMD_0050154"]
        options:
          enum_titles:
            - pmdco:Width
      id:
        title: ID
        type: string
        readOnly: true
        default: width-quality
      inheres_in:
        title: Inheres In
        type: string
        readOnly: true
        $comment: "Resolved from root.id"
      specified_by_value:
        title: Value Specification
        type: object
        required: [type, id, value, unit]
        properties:
          type:
            title: Type
            type: array
            items: {type: string}
            readOnly: true
            const: ["obi:0001931"]
            default: ["obi:0001931"]
            options:
              enum_titles:
                - obi:ScalarValueSpecification
          id:
            title: ID
            type: string
            readOnly: true
            default: width-svs
          value:
            title: Value
            type: number
            minimum: 0
          unit:
            title: Unit
            type: string
            enum:
              - "obo:UO_0000015"   # mm
              - "obo:UO_0000017"   # µm
            default: "obo:UO_0000015"
            options:
              enum_titles:
                - mm (millimetre)
                - µm (micrometre)

  length_quality:
    title: Length
    description: Length of the specimen (PMDCo PMD_0040001).
    type: object
    required:
      - type
      - id
      - specified_by_value
    properties:
      type:
        title: Type
        type: array
        items: {type: string}
        readOnly: true
        const: ["pmdco:PMD_0040001"]
        default: ["pmdco:PMD_0040001"]
        options:
          enum_titles:
            - pmdco:Length
      id:
        title: ID
        type: string
        readOnly: true
        default: length-quality
      inheres_in:
        title: Inheres In
        type: string
        readOnly: true
        $comment: "Resolved from root.id"
      specified_by_value:
        title: Value Specification
        type: object
        required: [type, id, value, unit]
        properties:
          type:
            title: Type
            type: array
            items: {type: string}
            readOnly: true
            const: ["obi:0001931"]
            default: ["obi:0001931"]
            options:
              enum_titles:
                - obi:ScalarValueSpecification
          id:
            title: ID
            type: string
            readOnly: true
            default: length-svs
          value:
            title: Value
            type: number
            minimum: 0
          unit:
            title: Unit
            type: string
            enum:
              - "obo:UO_0000015"   # mm
              - "obo:UO_0000017"   # µm
            default: "obo:UO_0000015"
            options:
              enum_titles:
                - mm (millimetre)
                - µm (micrometre)

  diameter_quality:
    title: Diameter
    description: Diameter of the specimen (PMDCo PMD_0050051). Use for cylindrical or disc specimens.
    type: object
    required:
      - type
      - id
      - specified_by_value
    properties:
      type:
        title: Type
        type: array
        items: {type: string}
        readOnly: true
        const: ["pmdco:PMD_0050051"]
        default: ["pmdco:PMD_0050051"]
        options:
          enum_titles:
            - pmdco:Diameter
      id:
        title: ID
        type: string
        readOnly: true
        default: diameter-quality
      inheres_in:
        title: Inheres In
        type: string
        readOnly: true
        $comment: "Resolved from root.id"
      specified_by_value:
        title: Value Specification
        type: object
        required: [type, id, value, unit]
        properties:
          type:
            title: Type
            type: array
            items: {type: string}
            readOnly: true
            const: ["obi:0001931"]
            default: ["obi:0001931"]
            options:
              enum_titles:
                - obi:ScalarValueSpecification
          id:
            title: ID
            type: string
            readOnly: true
            default: diameter-svs
          value:
            title: Value
            type: number
            minimum: 0
          unit:
            title: Unit
            type: string
            enum:
              - "obo:UO_0000015"   # mm
              - "obo:UO_0000017"   # µm
            default: "obo:UO_0000015"
            options:
              enum_titles:
                - mm (millimetre)
                - µm (micrometre)

  # ── Surface quality nodes ─────────────────────────────────────────────────

  roughness_ra:
    title: Surface Roughness Ra
    description: >-
      Arithmetic mean roughness (Ra) of the specimen surface
      (dsms:SurfaceRoughnessRa, subclass of pmdco:PMD_0040001 Length).
    type: object
    required:
      - type
      - id
      - specified_by_value
    properties:
      type:
        title: Type
        type: array
        items: {type: string}
        readOnly: true
        const: ["dspec:SurfaceRoughnessRa"]
        default: ["dspec:SurfaceRoughnessRa"]
        options:
          enum_titles:
            - dsms:SurfaceRoughnessRa
      id:
        title: ID
        type: string
        readOnly: true
        default: roughness-ra-quality
      inheres_in:
        title: Inheres In
        type: string
        readOnly: true
        $comment: "Resolved from root.id"
      specified_by_value:
        title: Value Specification
        type: object
        required: [type, id, value, unit]
        properties:
          type:
            title: Type
            type: array
            items: {type: string}
            readOnly: true
            const: ["obi:0001931"]
            default: ["obi:0001931"]
            options:
              enum_titles:
                - obi:ScalarValueSpecification
          id:
            title: ID
            type: string
            readOnly: true
            default: roughness-ra-svs
          value:
            title: Value
            type: number
            minimum: 0
          unit:
            title: Unit
            type: string
            enum:
              - "obo:UO_0000018"   # nm
              - "obo:UO_0000017"   # µm
            default: "obo:UO_0000018"
            options:
              enum_titles:
                - nm (nanometre)
                - µm (micrometre)

  roughness_rq:
    title: Surface Roughness Rq
    description: >-
      Root mean square roughness (Rq) of the specimen surface
      (dsms:SurfaceRoughnessRq, subclass of pmdco:PMD_0040001 Length).
    type: object
    required:
      - type
      - id
      - specified_by_value
    properties:
      type:
        title: Type
        type: array
        items: {type: string}
        readOnly: true
        const: ["dspec:SurfaceRoughnessRq"]
        default: ["dspec:SurfaceRoughnessRq"]
        options:
          enum_titles:
            - dsms:SurfaceRoughnessRq
      id:
        title: ID
        type: string
        readOnly: true
        default: roughness-rq-quality
      inheres_in:
        title: Inheres In
        type: string
        readOnly: true
        $comment: "Resolved from root.id"
      specified_by_value:
        title: Value Specification
        type: object
        required: [type, id, value, unit]
        properties:
          type:
            title: Type
            type: array
            items: {type: string}
            readOnly: true
            const: ["obi:0001931"]
            default: ["obi:0001931"]
            options:
              enum_titles:
                - obi:ScalarValueSpecification
          id:
            title: ID
            type: string
            readOnly: true
            default: roughness-rq-svs
          value:
            title: Value
            type: number
            minimum: 0
          unit:
            title: Unit
            type: string
            enum:
              - "obo:UO_0000018"   # nm
              - "obo:UO_0000017"   # µm
            default: "obo:UO_0000018"
            options:
              enum_titles:
                - nm (nanometre)
                - µm (micrometre)

  # ── Mass quality node ─────────────────────────────────────────────────────

  mass_quality:
    title: Mass
    description: Mass of the specimen (PMDCo PMD_0020133).
    type: object
    required:
      - type
      - id
      - specified_by_value
    properties:
      type:
        title: Type
        type: array
        items: {type: string}
        readOnly: true
        const: ["pmdco:PMD_0020133"]
        default: ["pmdco:PMD_0020133"]
        options:
          enum_titles:
            - pmdco:Mass
      id:
        title: ID
        type: string
        readOnly: true
        default: mass-quality
      inheres_in:
        title: Inheres In
        type: string
        readOnly: true
        $comment: "Resolved from root.id"
      specified_by_value:
        title: Value Specification
        type: object
        required: [type, id, value, unit]
        properties:
          type:
            title: Type
            type: array
            items: {type: string}
            readOnly: true
            const: ["obi:0001931"]
            default: ["obi:0001931"]
            options:
              enum_titles:
                - obi:ScalarValueSpecification
          id:
            title: ID
            type: string
            readOnly: true
            default: mass-svs
          value:
            title: Value
            type: number
            minimum: 0
          unit:
            title: Unit
            type: string
            enum:
              - "obo:UO_0000021"   # g
              - "obo:UO_0000022"   # kg
              - "obo:UO_0000023"   # mg
            default: "obo:UO_0000021"
            options:
              enum_titles:
                - g (gram)
                - kg (kilogram)
                - mg (milligram)

  # ── Surface preparation (text — no quality class) ─────────────────────────

  surface_preparation:
    title: Surface Preparation
    description: "Polishing sequence, e.g. SiC 800→1200 grit, 3µm + 1µm diamond, OPS"
    type: string
    format: textarea

  # ── Geometry descriptor ────────────────────────────────────────────────────

  specimen_form:
    title: Specimen Form
    type: string
    enum:
      - Bulk
      - Thin Film
      - Coating on Substrate
      - Cross-section
      - Other
