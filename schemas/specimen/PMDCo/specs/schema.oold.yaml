# OO-LD Schema for Specimen (PMDCo TemporallyQualifiedContinuant pattern)
# Ontology: Platform MaterialDigital Core Ontology (PMDCo)
#   https://w3id.org/pmd/co/
#
# PMDCo patterns:
#
#   1. TemporallyQualifiedContinuant / Duality Object–Material
#      https://github.com/materialdigital/core-ontology/tree/main/patterns/
#      → Specimen is a bfo:Object AND pmdco:TemporallyQualifiedContinuant.
#        It is_state_of (PMD_0000070) a Material entity.
#        It exists_at (BFO_0000108) a TemporalInterval (BFO_0000202).
#        Pre-test and post-test specimens of the same material each have their own
#        exists_at interval but share the same is_state_of Material link.
#
#   2. Material Property (Quality)
#      → Mass quality with ScalarValueSpecification (OBI_0001931).
#
# Graph pattern (state-change):
#
#   ex:the_material  a  pmdco:PMD_0000000 .                          # material anchor
#
#   ex:specimen_pre  a  bfo:BFO_0000030, pmdco:PMD_0000068 ;        # pre-test state
#     pmdco:PMD_0000070  ex:the_material ;                          # is_state_of
#     bfo:BFO_0000108    ex:intvl_pre .                             # exists_at
#
#   ex:specimen_post  a  bfo:BFO_0000030, pmdco:PMD_0000068 ;       # post-test state
#     pmdco:PMD_0000070  ex:the_material ;                          # is_state_of
#     bfo:BFO_0000108    ex:intvl_post .                            # exists_at
#
#   ex:process
#     obi:OBI_0000293  ex:specimen_pre ;                            # has_specified_input
#     obi:OBI_0000299  ex:specimen_post .                           # has_specified_output
#
# SPARQL state-change query:
#   SELECT ?process ?pre ?post ?material WHERE {
#     ?process obi:OBI_0000293 ?pre ;
#              obi:OBI_0000299 ?post .
#     ?pre  pmdco:PMD_0000070 ?material .
#     ?post pmdco:PMD_0000070 ?material .
#   }

"@context":
  obo: "http://purl.obolibrary.org/obo/"
  bfo:
    "@id": "http://purl.obolibrary.org/obo/BFO_"
    "@prefix": true
  ro:
    "@id": "http://purl.obolibrary.org/obo/RO_"
    "@prefix": true
  obi:
    "@id": "http://purl.obolibrary.org/obo/OBI_"
    "@prefix": true
  iao:
    "@id": "http://purl.obolibrary.org/obo/IAO_"
    "@prefix": true
  uo:
    "@id": "http://purl.obolibrary.org/obo/UO_"
    "@prefix": true
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  pmdco: "https://w3id.org/pmd/co/"
  schema: "https://schema.org/"
  conforms_to:
    "@id": "http://purl.org/dc/terms/conformsTo"
    "@type": "@id"
  type: "@type"
  id: "@id"
  label:
    "@id": "rdfs:label"
  # PMDCo is_state_of (PMD_0000070): links specimen to the abstract material identity.
  # Pre-test and post-test specimens of the SAME material both point here.
  material:
    "@id": "pmdco:PMD_0000070"
    "@type": "@id"
  # BFO exists_at (BFO_0000108): links specimen to the temporal interval of its existence.
  exists_at:
    "@id": "bfo:0000108"
    "@type": "@id"
  # Mass quality
  mass:
    "@id": "ro:0000086"   # RO_0000086  has_quality
    "@type": "@id"
  quality_of:
    "@id": "ro:0000080"   # RO_0000080  quality_of
    "@type": "@id"
  specified_by_value:
    "@id": "pmdco:PMD_0000077"
    "@type": "@id"
  value:
    "@id": "obi:0001937"  # OBI_0001937  has_specified_numeric_value
    "@type": "xsd:double"
  unit:
    "@id": "iao:0000039"  # IAO_0000039  has_measurement_unit_label
    "@type": "@id"
  source:
    "@id": "http://www.w3.org/ns/prov#wasDerivedFrom"
    "@type": "@id"
  # Specimen metadata (DSMS specimen vocabulary)
  temporal_state:
    "@id": "https://w3id.org/dsms/specimen#temporalState"
  material_designation:
    "@id": "http://purl.org/dc/terms/title"
  material_class:
    "@id": "https://w3id.org/dsms/specimen#hasMaterialClass"
  batch_lot:
    "@id": "https://w3id.org/dsms/specimen#hasBatchID"
  heat_treatment:
    "@id": "https://w3id.org/dsms/specimen#hasHeatTreatmentDescription"
  surface_preparation:
    "@id": "https://w3id.org/dsms/specimen#hasSurfacePreparation"
  surface_roughness_ra:
    "@id": "https://w3id.org/dsms/specimen#hasSurfaceRoughnessRa"
    "@type": "xsd:double"
  surface_roughness_rq:
    "@id": "https://w3id.org/dsms/specimen#hasSurfaceRoughnessRq"
    "@type": "xsd:double"
  specimen_form:
    "@id": "https://w3id.org/dsms/specimen#hasSpecimenForm"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: >-
  PMDCo TemporallyQualifiedContinuant pattern for a specimen.
  Typed as both bfo:Object and pmdco:TemporallyQualifiedContinuant.
  Links to Material via is_state_of (PMD_0000070) and to a TemporalInterval
  via exists_at (BFO_0000108). State-change demonstrated by connecting pre-test
  and post-test specimens — sharing the same material link — through a process.
x-schema-version: '0.5.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/kiran/schemas/specimen/PMDCo/specs/schema.oold.yaml'
x-maturity: 'draft'
title: Specimen
type: object
required:
  - type
  - id
  - label

properties:

  # ── Root types: Object + TemporallyQualifiedContinuant ─────────────────────

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["bfo:0000030", "pmdco:PMD_0000068"]
    default: ["bfo:0000030", "pmdco:PMD_0000068"]
    options:
      enum_titles:
        - bfo:Object
        - pmdco:TemporallyQualifiedContinuant

  id:
    title: ID
    description: Identifier for this specimen instance; managed by the consumer.
    type: string
    readOnly: true
    default: specimen

  label:
    title: Specimen Name
    description: >-
      Human-readable name or identifier for this specimen
      (e.g. "316L tensile bar #1 — pre-test").
    type: string

  # ── PMDCo state-change pattern ─────────────────────────────────────────────

  material:
    title: Material (is_state_of)
    description: >-
      The abstract material identity this specimen is a state of
      (pmdco:PMD_0000070 is_state_of). Pre-test and post-test specimens of the
      same material both link here — the process connecting them proves state change.
    type: string
    format: kitem
    x-kitem:
      ktypeIds: [material]

  exists_at:
    title: Exists At (Temporal Interval)
    description: >-
      The temporal interval during which this specimen exists in this state
      (bfo:BFO_0000108). Pre-test and post-test specimens have distinct intervals.
    type: object
    required:
      - type
      - id
    properties:
      type:
        title: Type
        type: array
        items:
          type: string
        readOnly: true
        const: ["bfo:0000202"]
        default: ["bfo:0000202"]
        options:
          enum_titles:
            - bfo:TemporalInterval
      id:
        title: Temporal Interval ID
        description: Identifier for this temporal interval node; managed by the consumer.
        type: string
        readOnly: true
        default: temporal-interval
      label:
        title: Description
        description: "Human label for this interval, e.g. 'before nanoindentation', 'after sawing'"
        type: string

  temporal_state:
    title: Temporal State
    description: >-
      Human-readable lifecycle label: as-received, pre-test, or post-test.
      Complements exists_at with a controlled vocabulary term for filtering.
    type: string
    enum:
      - as-received
      - pre-test
      - post-test

  # ── Provenance ─────────────────────────────────────────────────────────────

  source:
    title: Source
    description: >-
      The semi-finished product (e.g. metal sheet, rod) this specimen was
      cut or prepared from (prov:wasDerivedFrom).
    type: string
    format: kitem
    x-kitem:
      ktypeIds: [semi-finished-product]

  # ── Material metadata ──────────────────────────────────────────────────────

  material_designation:
    title: Material Designation
    description: "Standard designation or name, e.g. AA2618-T6, 316L, Fused Silica, PMMA"
    type: string

  material_class:
    title: Material Class
    type: string
    enum:
      - Metal
      - Ceramic
      - Polymer
      - Composite
      - Coating
      - Other

  batch_lot:
    title: Batch / Lot ID
    description: Batch or lot identifier for traceability.
    type: string

  # ── Thermal history ────────────────────────────────────────────────────────

  heat_treatment:
    title: Heat Treatment
    description: "e.g. Solution treated 530°C/1h + aged 190°C/2h (AA2618 T6)"
    type: string
    format: textarea

  # ── Surface quality ────────────────────────────────────────────────────────

  surface_preparation:
    title: Surface Preparation
    description: "Polishing/preparation sequence, e.g. SiC 800→1200 grit, 3µm + 1µm diamond, OPS"
    type: string
    format: textarea

  surface_roughness_ra:
    title: Surface Roughness Ra (nm)
    description: Arithmetic mean roughness in nanometres.
    type: number
    minimum: 0

  surface_roughness_rq:
    title: Surface Roughness Rq (nm)
    description: Root mean square roughness in nanometres.
    type: number
    minimum: 0

  # ── Geometry ───────────────────────────────────────────────────────────────

  specimen_form:
    title: Specimen Form
    description: "e.g. Bulk, Thin Film, Coating on Substrate, Cross-section"
    type: string
    enum:
      - Bulk
      - Thin Film
      - Coating on Substrate
      - Cross-section
      - Other

  # ── Mass quality ───────────────────────────────────────────────────────────

  mass:
    title: Mass
    description: >-
      The mass of this specimen, modelled as a PMDCo Mass quality
      (PMD_0020133) with a ScalarValueSpecification.
    type: object
    required:
      - type
      - id
      - quality_of
      - specified_by_value
    properties:
      type:
        title: Type
        type: array
        items:
          type: string
        readOnly: true
        const: ["pmdco:PMD_0020133"]
        default: ["pmdco:PMD_0020133"]
        options:
          enum_titles:
            - pmdco:Mass
      id:
        title: ID
        type: string
        readOnly: true
        default: mass
      quality_of:
        title: Quality Of
        description: Back-reference to the specimen this mass is a quality of.
        type: string
        readOnly: true
        $comment: Must match the root specimen id; set by the consumer.
      specified_by_value:
        title: Scalar Value
        type: object
        required:
          - type
          - id
          - value
          - unit
        properties:
          type:
            title: Type
            type: array
            items:
              type: string
            readOnly: true
            const: ["obi:0001931"]
            default: ["obi:0001931"]
            options:
              enum_titles:
                - obi:ScalarValueSpecification
          id:
            title: ID
            type: string
            readOnly: true
            default: mass-svs
          value:
            title: Mass Value
            type: number
            minimum: 0
          unit:
            title: Unit
            type: string
            enum:
              - "uo:0000021"
              - "uo:0000022"
              - "uo:0000023"
            default: ["uo:0000021"]
            options:
              enum_titles:
                - gram (g)
                - kilogram (kg)
                - milligram (mg)
