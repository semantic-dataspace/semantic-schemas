# OO-LD Schema for Specimen (PMDCo TemporallyQualifiedContinuant pattern)
# Ontology: Platform MaterialDigital Core Ontology (PMDCo)
#   https://w3id.org/pmd/co/
#
# PMDCo pattern: TemporallyQualifiedContinuant / Duality Object–Material
#   The Specimen KItem IS a TemporallyQualifiedContinuant (TQC) — a temporal
#   state of the abstract Material entity.
#
# Graph pattern:
#
#   Specimen (TQC)  a  bfo:BFO_0000030, pmdco:PMD_0000068
#     is_state_of  (PMD_0000070) ─────► Material KItem
#     exists_at    (BFO_0000108) ─────► TemporalRegion (BFO_0000008)
#     has_quality  (RO_0000086)  ─────► QualityNode  [× 0..N]
#       a  <quality class IRI>           (PMD_0050153|PMD_0050154|PMD_0040001|…)
#       inheres_in    (RO_0000052) ──── Specimen ← back-ref
#       specified_by_value (PMD_0000077) ─► ScalarValueSpec (OBI_0001931)
#         has_numeric_value (OBI_0001937)  xsd:double
#         has_unit_label    (IAO_0000039)  unit IRI
#     prov:wasDerivedFrom ───────────► semi-finished-product KItem
#     dsms:temporalState ────────────  "pre-test" | "post-test" | "as-received"
#     dsms:hasSurfacePreparation ────  text
#     dsms:hasSpecimenForm ──────────  text enum
#
# Physical properties are modelled as a dynamic array (like chemical-composition
# has_member) — user selects property type (quality class IRI) from a predefined
# list, enters value, and selects unit.
#
# State-change SPARQL:
#   SELECT ?process ?pre ?post ?material WHERE {
#     ?process obi:OBI_0000293 ?pre ;
#              obi:OBI_0000299 ?post .
#     ?pre  pmdco:PMD_0000070 ?material .
#     ?post pmdco:PMD_0000070 ?material .
#   }

"@context":
  obo:     "http://purl.obolibrary.org/obo/"
  bfo:
    "@id": "http://purl.obolibrary.org/obo/BFO_"
    "@prefix": true
  ro:
    "@id": "http://purl.obolibrary.org/obo/RO_"
    "@prefix": true
  obi:
    "@id": "http://purl.obolibrary.org/obo/OBI_"
    "@prefix": true
  iao:
    "@id": "http://purl.obolibrary.org/obo/IAO_"
    "@prefix": true
  uo:
    "@id": "http://purl.obolibrary.org/obo/UO_"
    "@prefix": true
  rdfs:    "http://www.w3.org/2000/01/rdf-schema#"
  xsd:     "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  pmdco:   "https://w3id.org/pmd/co/"
  dspec:   "https://w3id.org/dsms/specimen#"

  conforms_to:
    "@id": "http://purl.org/dc/terms/conformsTo"
    "@type": "@id"
  type: "@type"
  id: "@id"
  label:
    "@id": "rdfs:label"

  # PMDCo state relations
  material:
    "@id": "pmdco:PMD_0000070"        # is_state_of
    "@type": "@id"
  exists_at:
    "@id": "bfo:0000108"               # BFO_0000108  exists_at
    "@type": "@id"

  # Physical properties: all quality nodes share has_quality as predicate.
  # The quality class IRI is carried by the node's own rdf:type (type field).
  physical_properties:
    "@id": "ro:0000086"                # RO_0000086  has_quality
    "@type": "@id"
    "@container": "@set"

  # Quality node internals (inherited by nested objects via JSON-LD context)
  inheres_in:
    "@id": "ro:0000052"                # RO_0000052  inheres_in (back-ref to specimen)
    "@type": "@id"
  specified_by_value:
    "@id": "pmdco:PMD_0000077"         # PMD_0000077  specified_by_value
    "@type": "@id"
  value:
    "@id": "obi:0001937"               # OBI_0001937  has_specified_numeric_value
    "@type": "xsd:double"
  unit:
    "@id": "iao:0000039"               # IAO_0000039  has_measurement_unit_label
    "@type": "@id"

  # Provenance
  source:
    "@id": "http://www.w3.org/ns/prov#wasDerivedFrom"
    "@type": "@id"

  # DSMS specimen metadata
  temporal_state:
    "@id": "dspec:temporalState"
  surface_preparation:
    "@id": "dspec:hasSurfacePreparation"
  specimen_form:
    "@id": "dspec:hasSpecimenForm"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: >-
  PMDCo TemporallyQualifiedContinuant schema for a specimen state.
  Physical properties (geometry, mass, surface roughness) are modelled as a
  dynamic quality-node array, mirroring the chemical-composition has_member
  pattern. Each row: select property type (PMDCo quality class IRI), enter
  value, pick unit.
x-schema-version: '0.6.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/kiran/schemas/specimen/PMDCo/specs/schema.oold.yaml'
x-maturity: 'draft'
title: Specimen
type: object
required:
  - type
  - id
  - label

properties:

  # ── Root types ─────────────────────────────────────────────────────────────

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["bfo:0000030", "pmdco:PMD_0000068"]
    default: ["bfo:0000030", "pmdco:PMD_0000068"]
    options:
      enum_titles:
        - bfo:Object
        - pmdco:TemporallyQualifiedContinuant

  id:
    title: ID
    description: Identifier for this specimen instance; managed by the consumer.
    type: string
    readOnly: true
    default: specimen

  label:
    title: Specimen Name
    description: "Human-readable name, e.g. '316L bar #1 — pre-test'"
    type: string

  # ── PMDCo state pattern ────────────────────────────────────────────────────

  material:
    title: Material (is_state_of)
    description: >-
      Abstract material identity this specimen is a state of (PMD_0000070).
      Pre-test and post-test specimens of the same material both link here,
      enabling state-change SPARQL.
    type: string
    format: kitem
    x-kitem:
      ktypeIds: [material]

  exists_at:
    title: Exists At (Temporal Region)
    description: >-
      Temporal region during which this specimen exists in this state
      (BFO_0000108 → BFO_0000008 TemporalRegion).
    type: object
    required:
      - type
      - id
    properties:
      type:
        title: Type
        type: array
        items: {type: string}
        readOnly: true
        const: ["bfo:0000008"]
        default: ["bfo:0000008"]
        options:
          enum_titles:
            - bfo:TemporalRegion
      id:
        title: Temporal Region ID
        type: string
        readOnly: true
        default: temporal-region
      label:
        title: Description
        description: "e.g. 'before nanoindentation', 'after sawing'"
        type: string

  temporal_state:
    title: Temporal State
    description: "Controlled lifecycle label: as-received, pre-test, or post-test."
    type: string
    enum:
      - as-received
      - pre-test
      - post-test

  source:
    title: Source
    description: Semi-finished product this specimen was cut from (prov:wasDerivedFrom).
    type: string
    format: kitem
    x-kitem:
      ktypeIds: [semi-finished-product]

  # ── Physical properties ────────────────────────────────────────────────────
  # Dynamic quality-node array. Each row:
  #   1. Select property type (PMDCo quality class IRI)
  #   2. Enter numeric value
  #   3. Select unit (filtered by property type via x-depends-on)
  #
  # Predefined types and their PMDCo class IRIs:
  #   Thickness          pmdco:PMD_0050153   (subclass of Length PMD_0040001)
  #   Width              pmdco:PMD_0050154   (subclass of Length PMD_0040001)
  #   Length             pmdco:PMD_0040001
  #   Diameter           pmdco:PMD_0050051   (subclass of Length PMD_0040001)
  #   Mass               pmdco:PMD_0020133
  #   Surface Roughness Ra  dspec:SurfaceRoughnessRa  (subclass of PMD_0040001)
  #   Surface Roughness Rq  dspec:SurfaceRoughnessRq  (subclass of PMD_0040001)

  physical_properties:
    title: Physical Properties
    description: >-
      Dimensional and physical properties of this specimen state, modelled as
      PMDCo quality nodes (RO_0000086 has_quality). Add one row per property.
    type: array
    items:
      type: object
      title: Physical Property
      required:
        - type
        - id
        - specified_by_value
      properties:
        type:
          title: Property Type
          description: Select the property — sets the PMDCo quality class on this node.
          type: string
          enum:
            - pmdco:PMD_0050153       # Thickness
            - pmdco:PMD_0050154       # Width
            - pmdco:PMD_0040001       # Length
            - pmdco:PMD_0050051       # Diameter
            - pmdco:PMD_0020133       # Mass
            - dspec:SurfaceRoughnessRa
            - dspec:SurfaceRoughnessRq
          options:
            enum_titles:
              - Thickness
              - Width
              - Length
              - Diameter
              - Mass
              - Surface Roughness Ra
              - Surface Roughness Rq
        id:
          title: ID
          type: string
          readOnly: true
          default: physical-property-1
        inheres_in:
          title: Inheres In
          description: Back-reference to this specimen; resolved automatically.
          type: string
          readOnly: true
          $comment: "Resolved from root.id"
        specified_by_value:
          title: Value Specification
          type: object
          required:
            - type
            - id
            - value
            - unit
          properties:
            type:
              title: Type
              type: array
              items: {type: string}
              readOnly: true
              const: ["obi:0001931"]
              default: ["obi:0001931"]
              options:
                enum_titles:
                  - obi:ScalarValueSpecification
            id:
              title: ID
              type: string
              readOnly: true
              default: physical-property-svs-1
            value:
              title: Value
              type: number
              minimum: 0
            unit:
              title: Unit
              type: string
              enum:
                - "obo:UO_0000015"    # mm
                - "obo:UO_0000017"    # µm
                - "obo:UO_0000018"    # nm
                - "obo:UO_0000021"    # g
                - "obo:UO_0000022"    # kg
                - "obo:UO_0000023"    # mg
              options:
                enum_titles:
                  - mm (millimetre)
                  - µm (micrometre)
                  - nm (nanometre)
                  - g (gram)
                  - kg (kilogram)
                  - mg (milligram)
              x-depends-on:
                field: type
                values:
                  pmdco:PMD_0050153:      ["obo:UO_0000015", "obo:UO_0000017"]
                  pmdco:PMD_0050154:      ["obo:UO_0000015", "obo:UO_0000017"]
                  pmdco:PMD_0040001:      ["obo:UO_0000015", "obo:UO_0000017"]
                  pmdco:PMD_0050051:      ["obo:UO_0000015", "obo:UO_0000017"]
                  pmdco:PMD_0020133:      ["obo:UO_0000021", "obo:UO_0000022", "obo:UO_0000023"]
                  dspec:SurfaceRoughnessRa: ["obo:UO_0000018", "obo:UO_0000017"]
                  dspec:SurfaceRoughnessRq: ["obo:UO_0000018", "obo:UO_0000017"]
    default: []

  # ── Surface preparation (text field — no quality class) ────────────────────

  surface_preparation:
    title: Surface Preparation
    description: "Polishing sequence, e.g. SiC 800→1200 grit, 3µm + 1µm diamond, OPS"
    type: string
    format: textarea

  specimen_form:
    title: Specimen Form
    type: string
    enum:
      - Bulk
      - Thin Film
      - Coating on Substrate
      - Cross-section
      - Other
