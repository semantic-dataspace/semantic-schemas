# OO-LD Schema for Dataset Catalog (DCAT)
# Ontology: W3C Data Catalog Vocabulary (DCAT 3)
#   https://www.w3.org/TR/vocab-dcat-3/
#
# DCAT class hierarchy:
#   dcat:Dataset  ←── dataset/generic/DCAT base schema
#     └── dcat:Catalog  ←── this schema
#
# This schema composes with dataset/generic/DCAT via allOf and adds:
#   - type const  →  dcat:Catalog
#   - dcat:dataset field  →  lists member dataset k-items
#
# Graph pattern (adds to dataset/generic/DCAT):
#
#   dcat:Catalog
#     [all fields from dataset/generic/DCAT]
#     dcat:dataset ────────────────────────────► Dataset IRI  [× 0..N]
#
# Design notes:
#   - dcat:dataset is the DCAT-native property for catalog membership,
#     distinct from dcterms:hasPart (structural composition).
#     Use it when this catalog groups datasets by discovery or provenance
#     (e.g. all measurement series from one campaign).
#   - Individual datasets within a series still use has_part from
#     dataset/generic/DCAT for their sub-datasets and documents.

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: Schema for a dcat:Catalog grouping member datasets.
x-schema-version: '0.1.1'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/dataset-catalog-DCAT-v0.1.1/schemas/dataset/catalog/DCAT/specs/schema.oold.generated.json'
x-maturity: 'draft'
title: Dataset Catalog
type: object

allOf:
  - $ref: "../../../generic/DCAT/specs/schema.oold.yaml"

"@context":
  # dcat:dataset: links a catalog to its member datasets
  dataset:
    "@id": "http://www.w3.org/ns/dcat#dataset"
    "@type": "@id"
    "@container": "@set"

properties:

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["dcat:Catalog"]
    default: ["dcat:Catalog"]
    options:
      enum_titles:
        - dcat:Catalog

  dataset:
    title: Datasets
    description: >-
      Dataset k-items listed in this catalog,
      e.g. the measurement series belonging to a campaign.
      Select the corresponding entries from the knowledge graph.
    x-ktype: [dataset, dataset-catalog]
    type: array
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []
