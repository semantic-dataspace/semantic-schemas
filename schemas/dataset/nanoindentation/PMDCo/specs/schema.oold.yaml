# OO-LD Schema for Nanoindentation Dataset (DCAT + PMDCo / CHAMEO pattern)
#
# Digital twin of a single nanoindentation measurement file.
# Extends the generic dataset/DCAT schema with:
#   - Indent position metadata (index, XY stage coordinates, timestamp)
#   - Per-indent scalar results as MeasurementDatum + ScalarValueSpecification nodes
#   - Raw load-displacement time-series (attached CSV / XLSX file, processed by data2rdf)
#
# Relationships to parent experiment and specimen are expressed via DSMS linked_kitems,
# not as fields in the semantic schema.
#
# Graph pattern (additions to DCAT base):
#
#   dcat:Dataset
#     obi:OBI_0000299 (measured_properties) ─────────────► MeasurementDatum [× 0..N]
#       obi:OBI_0001938 (has_value_spec) ───────────────► ScalarValueSpecification
#         obi:OBI_0001937 (result_value) ────────── xsd:double
#         iao:IAO_0000039 (result_unit) ──────────── unit IRI (QUDT)

"@context":
  rdf:     "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs:    "http://www.w3.org/2000/01/rdf-schema#"
  xsd:     "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  dcat:    "http://www.w3.org/ns/dcat#"
  obo:     "http://purl.obolibrary.org/obo/"
  obi:
    "@id": "http://purl.obolibrary.org/obo/OBI_"
    "@prefix": true
  bfo:
    "@id": "http://purl.obolibrary.org/obo/BFO_"
    "@prefix": true
  qudt:    "http://qudt.org/schema/qudt/"
  uqudt:   "http://qudt.org/vocab/unit/"
  chameo:  "https://w3id.org/emmo/domain/characterisation-methodology/chameo#"
  dnano:   "https://w3id.org/dsms/nanoindentation#"
  pmdco:   "https://w3id.org/pmd/co/"
  csvw:    "http://www.w3.org/ns/csvw#"
  type:    "@type"
  id:      "@id"
  label:
    "@id": "rdfs:label"
  description:
    "@id": "http://purl.org/dc/terms/description"
  identifier:
    "@id": "http://purl.org/dc/terms/identifier"
  keywords:
    "@id": "http://www.w3.org/ns/dcat#keyword"
    "@container": "@set"
  format:
    "@id": "http://purl.org/dc/terms/format"
  created:
    "@id": "http://purl.org/dc/terms/created"
    "@type": "xsd:dateTime"
  modified:
    "@id": "http://purl.org/dc/terms/modified"
    "@type": "xsd:date"
  license:
    "@id": "http://purl.org/dc/terms/license"
  has_part:
    "@id": "http://purl.org/dc/terms/hasPart"
    "@type": "@id"
    "@container": "@set"
  measured_properties:
    "@id": "http://purl.obolibrary.org/obo/OBI_0000299"
    "@container": "@set"
  has_value_spec:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001938"
  result_value:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001937"
    "@type": "xsd:double"
  result_unit:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000039"
    "@type": "@id"
  specifies_value_of:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001927"
  quality_of:
    "@id": "http://purl.obolibrary.org/obo/RO_0000080"
    "@type": "@id"
  timeseries_column:
    "@id": "http://www.w3.org/ns/csvw#column"
    "@container": "@set"
  col_name:
    "@id": "http://www.w3.org/ns/csvw#name"
  property_url:
    "@id": "http://www.w3.org/ns/csvw#propertyUrl"
    "@type": "@id"
  has_unit:
    "@id": "http://qudt.org/schema/qudt/hasUnit"
    "@type": "@id"

allOf:
  - $ref: "../../../generic/DCAT/specs/schema.oold.yaml"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: Digital twin of a single nanoindentation indent file — metadata + scalar results + raw time-series.
x-schema-version: '0.1.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/dataset-nanoindentation-PMDCo-v0.1.0/schemas/dataset/nanoindentation/PMDCo/specs/schema.oold.generated.json'
x-maturity: 'draft'
title: Nanoindentation Dataset (PMDCo)
type: object

required:
  - type
  - id
  - label

properties:

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["dcat:Dataset"]
    default: ["dcat:Dataset"]
    options:
      enum_titles:
        - dcat:Dataset

  id:
    title: ID
    type: string
    readOnly: true
    default: nanoindentation-dataset

  label:
    title: Dataset Name
    description: "e.g. AA2618 2hr aged Set 2 — Indent #001"
    type: string

  description:
    title: Description
    type: string
    format: textarea

  format:
    title: File Format
    description: "Instrument file format (e.g. Anton Paar NHT TXT, Bruker HYSITRON CSV)"
    type: string

  created:
    title: Timestamp
    description: Date and time of this individual indentation.
    type: string
    format: date-time

  indent_index:
    title: Indent Index
    description: Sequential number of this indentation within the session (1-based).
    type: integer
    minimum: 1

  x_position:
    title: X Position (mm)
    description: Stage X position at time of indent.
    type: number

  y_position:
    title: Y Position (mm)
    description: Stage Y position at time of indent.
    type: number

  analysis_warnings:
    title: Analysis Warnings
    description: Warnings reported by instrument software (e.g. 'hc out of calibrated range').
    type: string
    format: textarea

  measured_properties:
    title: Indentation Results
    description: >-
      Scalar results computed from the load-displacement curve by the analysis software.
      Each entry is a MeasurementDatum (IAO_0000109) with an embedded
      ScalarValueSpecification (OBI_0001931).
    type: array
    items:
      type: object
      title: Indentation Result
      required:
        - type
        - id
        - label
        - result_value
        - result_unit
      properties:
        type:
          title: Type
          type: array
          items:
            type: string
          readOnly: true
          const: ["obo:OBI_0001931"]
          default: ["obo:OBI_0001931"]
          options:
            enum_titles:
              - obi:ScalarValueSpecification
        id:
          title: Value Spec ID
          type: string
          readOnly: true
          default: svs-1
        label:
          title: Result Name
          type: string
          enum:
            - Hardness HIT
            - Elastic Modulus EIT
            - Reduced Modulus E*
            - Indentation Modulus Er
            - Vickers Equivalent HVIT
            - Maximum Force Fmax
            - Maximum Depth hmax
            - Contact Depth hc
            - Residual Depth hr
            - Plastic Depth hp
            - Contact Stiffness S
            - Projected Contact Area Ap
            - Elastic Work Welast
            - Plastic Work Wplast
            - Total Work Wtotal
            - Elastic Work Ratio nIT
            - Reverse Indentation Ratio RIT
            - Loading Exponent m
            - Geometry Factor Epsilon
            - Fit Quality R2
            - Load Stiffness Ratio F/S2
        result_value:
          title: Value
          type: number
        result_unit:
          title: Unit
          type: string
          enum:
            - uqudt:GigaPA
            - uqudt:MicroM
            - uqudt:MicroM2
            - uqudt:MilliN
            - uqudt:MilliN-PER-MicroM
            - uqudt:PERCENT
            - uqudt:UNITLESS
            - uqudt:MicroJ
            - uqudt:MicroM2-PER-MilliN
          options:
            enum_titles:
              - GPa (gigapascal)
              - "µm (micrometre)"
              - "µm² (square micrometre)"
              - mN (millinewton)
              - "mN/µm (millinewton per micrometre)"
              - "% (percent)"
              - "– (dimensionless)"
              - "µJ (microjoule)"
              - "µm²/mN (square micrometre per millinewton)"
          x-depends-on:
            field: label
            values:
              Hardness HIT:              [uqudt:GigaPA]
              Elastic Modulus EIT:       [uqudt:GigaPA]
              Reduced Modulus E*:        [uqudt:GigaPA]
              Indentation Modulus Er:    [uqudt:GigaPA]
              Vickers Equivalent HVIT:   [uqudt:UNITLESS]
              Maximum Force Fmax:        [uqudt:MilliN]
              Maximum Depth hmax:        [uqudt:MicroM]
              Contact Depth hc:          [uqudt:MicroM]
              Residual Depth hr:         [uqudt:MicroM]
              Plastic Depth hp:          [uqudt:MicroM]
              Contact Stiffness S:       [uqudt:MilliN-PER-MicroM]
              Projected Contact Area Ap: [uqudt:MicroM2]
              Elastic Work Welast:       [uqudt:MicroJ]
              Plastic Work Wplast:       [uqudt:MicroJ]
              Total Work Wtotal:         [uqudt:MicroJ]
              Elastic Work Ratio nIT:    [uqudt:PERCENT]
              Reverse Indentation Ratio RIT: [uqudt:PERCENT]
              Loading Exponent m:        [uqudt:UNITLESS]
              Geometry Factor Epsilon:   [uqudt:UNITLESS]
              Fit Quality R2:            [uqudt:UNITLESS]
              Load Stiffness Ratio F/S2: [uqudt:MicroM2-PER-MilliN]
        specifies_value_of:
          title: Quality
          description: >-
            Quality of the specimen this measurement specifies (OBI_0001927).
            Type is auto-mapped from Result Name via the dsms-nanoindentation vocabulary
            (https://w3id.org/dsms/nanoindentation). Supply the specimen IRI in quality_of.
          type: object
          required:
            - type
            - id
          properties:
            type:
              title: Quality Type
              description: Quality class IRI aligned to PMDCo (auto-selected by result name).
              type: array
              items:
                type: string
                enum:
                  - pmdco:PMD_0000789
                  - dnano:VickersEquivalentHardnessIT
                  - dnano:ElasticModulusIT
                  - dnano:ReducedModulus
                  - dnano:IndentationModulus
                  - dnano:ContactStiffness
                  - dnano:MaximumIndentationForce
                  - dnano:MaximumIndentationDepth
                  - dnano:ContactDepth
                  - dnano:ResidualDepth
                  - dnano:PlasticDepth
                  - dnano:ProjectedContactArea
                  - dnano:ElasticWork
                  - dnano:PlasticWork
                  - dnano:TotalWork
                  - dnano:ElasticWorkRatio
                  - dnano:ReverseIndentationRatio
                  - dnano:LoadingExponent
                  - dnano:GeometryFactor
                  - dnano:FitQuality
                  - dnano:LoadStiffnessRatio
              x-depends-on:
                field: label
                values:
                  Hardness HIT:              [pmdco:PMD_0000789]
                  Vickers Equivalent HVIT:   [dnano:VickersEquivalentHardnessIT]
                  Elastic Modulus EIT:       [dnano:ElasticModulusIT]
                  Reduced Modulus E*:        [dnano:ReducedModulus]
                  Indentation Modulus Er:    [dnano:IndentationModulus]
                  Contact Stiffness S:       [dnano:ContactStiffness]
                  Maximum Force Fmax:        [dnano:MaximumIndentationForce]
                  Maximum Depth hmax:        [dnano:MaximumIndentationDepth]
                  Contact Depth hc:          [dnano:ContactDepth]
                  Residual Depth hr:         [dnano:ResidualDepth]
                  Plastic Depth hp:          [dnano:PlasticDepth]
                  Projected Contact Area Ap: [dnano:ProjectedContactArea]
                  Elastic Work Welast:       [dnano:ElasticWork]
                  Plastic Work Wplast:       [dnano:PlasticWork]
                  Total Work Wtotal:         [dnano:TotalWork]
                  Elastic Work Ratio nIT:    [dnano:ElasticWorkRatio]
                  Reverse Indentation Ratio RIT: [dnano:ReverseIndentationRatio]
                  Loading Exponent m:        [dnano:LoadingExponent]
                  Geometry Factor Epsilon:   [dnano:GeometryFactor]
                  Fit Quality R2:            [dnano:FitQuality]
                  Load Stiffness Ratio F/S2: [dnano:LoadStiffnessRatio]
            id:
              title: Quality ID
              type: string
              readOnly: true
              default: quality-1
            quality_of:
              title: Specimen IRI
              description: IRI of the specimen this quality inheres in.
              type: string
              format: uri
    default: []

  timeseries_column:
    title: Timeseries Column Specifications
    description: >-
      Semantic column specifications for the load-displacement CSV attachment.
      Each entry maps one column name to its physical property IRI (from the
      nanoindentation EMMO ontology) and QUDT unit IRI.
    type: array
    items:
      type: object
      required:
        - col_name
        - property_url
        - has_unit
      properties:
        id:
          title: Column Spec ID
          type: string
          readOnly: true
        type:
          title: Type
          type: array
          items:
            type: string
          readOnly: true
          const: ["csvw:Column"]
          default: ["csvw:Column"]
        col_name:
          title: Column Name
          type: string
        property_url:
          title: Physical Property IRI
          description: EMMO nanoindentation property IRI for this column.
          type: string
        has_unit:
          title: Unit IRI
          description: QUDT unit IRI for this column.
          type: string
    default: []
