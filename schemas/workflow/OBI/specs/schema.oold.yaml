# OO-LD Schema for Workflow (OBI / BFO pattern)
# Ontology: Open Biomedical Investigations (OBI) / BFO
#   http://purl.obolibrary.org/obo/obi.owl
#   http://purl.obolibrary.org/obo/bfo.owl
#
# Design:
#   A workflow is a lightweight named container that orders and groups process step IRIs.
#   Each step is recorded independently using an x-process-step schema (tensile test,
#   simulation, sample preparation, etc.) and referenced here by IRI.
#   The full process graph is reconstructed by following step IRIs; the workflow node
#   adds a human-readable envelope and provenance context.
#
#   Replaces the previous embed-everything workflow schema and the
#   characterization/campaign/PMDCo/ schema, which is now redundant.
#
# Graph pattern:
#
#   obo:OBI_0000272  (AnalyticProtocol)
#     rdfs:label ──────────────────────────────── workflow name
#     rdfs:comment ────────────────────────────── description  (optional)
#     dcterms:date ────────────────────────────── start date  (optional)
#     dcterms:creator ─────────────────────────── responsible person IRI  (optional)
#     obo:BFO_0000051 ─────────────────────────► step IRI  [× 1..N]  (has_part)
#       each IRI resolves to a process instance recorded with an x-process-step schema

"@context":
  rdf:     "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs:    "http://www.w3.org/2000/01/rdf-schema#"
  xsd:     "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  obo:     "http://purl.obolibrary.org/obo/"
  conforms_to:
    "@id": "http://purl.org/dc/terms/conformsTo"
    "@type": "@id"
  type:    "@type"
  id:      "@id"
  label:
    "@id": "rdfs:label"
  description:
    "@id": "rdfs:comment"
  responsible:
    "@id": "http://purl.org/dc/terms/creator"
    "@type": "@id"
  # bfo:BFO_0000051: this workflow has these process steps as parts (ordered list)
  steps:
    "@id": "http://purl.obolibrary.org/obo/BFO_0000051"
    "@type": "@id"
    "@container": "@list"
  "@base": "https://example.org/"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: >-
  Lightweight workflow container (OBI pattern).
  References independently recorded process step IRIs rather than embedding step data.
  Steps are recorded with x-process-step schemas; this schema provides the ordered
  envelope. Replaces workflow/PMDCo/ v1.1.0 and characterization/campaign/PMDCo/.
x-schema-version: '0.1.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/workflow-OBI-v0.1.0/schemas/workflow/OBI/specs/schema.oold.yaml'
x-maturity: 'draft'
title: Workflow (OBI)
description: Ordered sequence of process steps forming an experiment or campaign
type: object

required:
  - type
  - id
  - label
  - steps

properties:

  type:
    title: Type
    type: string
    readOnly: true
    const: "obo:OBI_0000272"
    default: "obo:OBI_0000272"
    options:
      enum_titles:
        - obi:AnalyticProtocol

  id:
    title: ID
    description: Identifier for this workflow instance; managed by the consumer.
    type: string
    readOnly: true
    default: workflow

  label:
    title: Workflow Name
    description: Human-readable name for this workflow or experiment.
    type: string

  description:
    title: Description
    description: Optional free-text summary of the workflow goal and context.
    type: string
    format: textarea

  responsible:
    title: Responsible Person
    description: Person accountable for this workflow. Select from the knowledge graph.
    type: string
    format: uri

  steps:
    title: Process Steps
    description: >-
      Ordered list of process step IRIs that make up this workflow.
      Each IRI must resolve to an instance recorded with an x-process-step schema
      (tensile test, simulation, sample preparation, etc.).
      The order here reflects the intended execution sequence.
    type: array
    minItems: 1
    items:
      type: string
      format: uri
    default: []
