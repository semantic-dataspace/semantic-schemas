# OO-LD Schema for TensileTest (PMDCo measurement pattern)
# Ontology: Platform MaterialDigital Core Ontology (PMDCo)
#   https://w3id.org/pmd/co/
#
# PMDCo measurement pattern:
#   https://github.com/materialdigital/core-ontology/tree/main/patterns/measurement
#
# This schema uses the generic PMDCo measurement pattern without TTO-specific
# property class enumerations.  Results are labelled by name rather than typed
# to TTO classes.  Use characterization/tensile-test/TTO/ when TTO
# classification of individual measurement properties is required.
#
# Full graph pattern (OBI measurement pattern via PMDCo):
#
#   TensileTestingProcess  (pmdco:PMD_0000974)          ← subClassOf OBI:assay
#     rdfs:label ──────────────────────────────────────── name string
#     rdfs:comment ────────────────────────────────────── description  (optional)
#     realizes ───────────────────────────────────────► EvaluantRole  [× 1+]  (bfo:BFO_0000055)
#       type ─────────────────── obo:OBI_0000067
#     has_specified_input ────────────────────────────► Specimen IRI  [× 1+]  (obi:OBI_0000293)
#       ↳ (on specimen) has_role → same EvaluantRole   [obo:RO_0000087]
#       ↳ (on specimen) has_quality → Quality IRI      [obo:RO_0000086]
#     preceded_by ────────────────────────────────────► Process IRI  [× 0..N]
#     has_process_attribute ──────────────────────────► ProcessAttribute  [× 0..N]  (pmdco:PMD_0000009)
#     has_specified_output ───────────────────────────► MeasurementDatum  [× 0..N]  (obi:OBI_0000299)
#       type ─────────────────── obo:IAO_0000109
#       rdfs:label ──────────────── result name (e.g. "Yield Strength")
#       is_about ────────────────► Specimen IRI         (iao:IAO_0000136)
#       is_quality_measurement_of ► Quality IRI         (iao:IAO_0000221)
#       has_value_spec ──────────► ScalarValueSpec       (obi:OBI_0001938)
#         type ──────────────────── obo:OBI_0001931
#         result_value ────────── xsd:double             (obi:OBI_0001937 has_specified_numeric_value)
#         result_unit ─────────── unit IRI  (QUDT)       (iao:IAO_0000039)
#         specifies_value_of ──► Quality IRI             (obi:OBI_0001927)

"@context":
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  conforms_to:
    "@id": "http://purl.org/dc/terms/conformsTo"
    "@type": "@id"
  date:
    "@id": "http://purl.org/dc/terms/date"
    "@type": "xsd:dateTime"
  obo: "http://purl.obolibrary.org/obo/"
  obi:
    "@id": "http://purl.obolibrary.org/obo/OBI_"
    "@prefix": true
  bfo:
    "@id": "http://purl.obolibrary.org/obo/BFO_"
    "@prefix": true
  pmdco: "https://w3id.org/pmd/co/"
  qudt: "http://qudt.org/schema/qudt/"
  uqudt: "http://qudt.org/vocab/unit/"
  type: "@type"
  id: "@id"
  label:
    "@id": "rdfs:label"
  description:
    "@id": "rdfs:comment"
  "@base": "https://w3id.org/pmd/co/test/shape_tensile_test_pmdco#"
  # bfo:BFO_0000055  — the assay realizes the evaluant role
  realizes:
    "@id": "http://purl.obolibrary.org/obo/BFO_0000055"
    "@type": "@id"
    "@container": "@set"
  # bfo:BFO_0000054  — inverse of realizes; set on the role node pointing back to the assay
  realized_in:
    "@id": "http://purl.obolibrary.org/obo/BFO_0000054"
    "@type": "@id"
  has_specified_input:
    "@id": "obi:0000293"
    "@type": "@id"
    "@container": "@set"
  preceded_by:
    "@id": "bfo:0000062"
    "@type": "@id"
    "@container": "@set"
  # pmdco:PMD_0000009 "has process attribute" — process-level quantitative conditions
  has_process_attribute:
    "@id": "pmdco:PMD_0000009"
    "@type": "@id"
    "@container": "@set"
  parameter_label:
    "@id": "rdfs:label"
  parameter_value:
    "@id": "qudt:value"
    "@type": "xsd:double"
  parameter_unit:
    "@id": "qudt:hasUnit"
    "@type": "@id"
  # obi:OBI_0000299  — measurement datum nodes are the specified outputs
  measured_properties:
    "@id": "http://purl.obolibrary.org/obo/OBI_0000299"
    "@container": "@set"
  # iao:IAO_0000136  — datum / value-spec is about the evaluated entity
  is_about:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000136"
    "@type": "@id"
  # iao:IAO_0000221  — datum is a measurement of this quality
  is_quality_measurement_of:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000221"
    "@type": "@id"
  # obi:OBI_0001938  — scalar value specification embedded in each datum
  has_value_spec:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001938"
  # obi:OBI_0001937  — canonical numeric value predicate for ScalarValueSpecification
  result_value:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001937"
    "@type": "xsd:double"
  # iao:IAO_0000039  — unit IRI
  result_unit:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000039"
    "@type": "@id"
  # obi:OBI_0001927  — value spec points back to the quality it quantifies
  specifies_value_of:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001927"
    "@type": "@id"

# ── Time-series descriptor pattern ────────────────────────────────────────────
# Controls how Transformer generates the column-level RDF when a parser returns
# time-series data.  Follows the csvw + IAO_0000039 pattern used in the TTO
# v3.0.0 reference data (S355_data_tto_pmdco3.ttl).
timeseries_pattern:
  container_type:        "http://www.w3.org/ns/csvw#Table"
  column_predicate:      "http://www.w3.org/ns/csvw#column"
  column_type:           "http://www.w3.org/ns/csvw#Column"
  column_name_predicate: "http://www.w3.org/ns/csvw#name"
  unit_predicate:        "http://purl.obolibrary.org/obo/IAO_0000039"
  container_label:       "Raw time series"

allOf:
  - $ref: "../../../../process-step/PMDCo/specs/schema.oold.yaml"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: PMDCo measurement pattern schema for a tensile test process
x-schema-version: '0.2.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/tensile-test-PMDCo-v0.2.0/schemas/characterization/tensile-test/PMDCo/specs/schema.oold.yaml'
x-maturity: 'draft'
x-process-step:
  category: characterization
# x-transformers lists the backend parser IDs that can ingest instrument files for this schema.
# The webform-builder adapter uses this to inject a File upload field into the form and expose
# Webform.transformers to the consuming application.  The application is responsible for routing
# the uploaded file to the appropriate backend service and pre-filling the form with its output.
# Supported IDs: testxpert_iii (ZwickRoell TestXpert III export files, .TXT format).
x-transformers: [testxpert_iii]
title: Tensile Test (PMDCo)
type: object

required:
  - type
  - id
  - label
  - realizes
  - has_specified_input

properties:

  type:
    title: Type
    type: string
    readOnly: true
    const: "pmdco:PMD_0000974"
    default: "pmdco:PMD_0000974"
    options:
      enum_titles:
        - pmdco:TensileTestingProcess

  id:
    title: ID
    description: Identifier for this tensile test instance; managed by the consumer.
    type: string
    readOnly: true
    default: tensile-test

  label:
    title: Test Name
    description: >-
      Human-readable name for this tensile test
      (e.g. "Tensile test 316L bar 1").
    type: string

  description:
    title: Description
    description: Optional free-text description.
    type: string
    format: textarea

  realizes:
    title: Evaluant Role(s)
    description: >-
      The evaluant role (OBI_0000067) that this assay realizes.
      Structural RDF plumbing — managed automatically by the transformer.
    type: array
    readOnly: true
    minItems: 1
    default:
      - type: "obo:OBI_0000067"
        id: "evaluant-role-1"
        realized_in: "tensile-test"
    items:
      type: object
      title: Evaluant Role
      required:
        - type
        - id
        - realized_in
      properties:
        type:
          title: Type
          type: string
          readOnly: true
          const: "obo:OBI_0000067"
          default: "obo:OBI_0000067"
        id:
          title: Role IRI
          type: string
          readOnly: true
          default: evaluant-role-1
        realized_in:
          title: Realized In
          type: string
          readOnly: true
          default: "tensile-test"

  has_specified_input:
    title: Specimen
    description: >-
      The material sample (specimen) that was tested.
      Select the corresponding entry from the knowledge graph.
    x-kitem:
      ktypeIds: ["specimen"]
    type: array
    minItems: 1
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  # preceded_by (BFO_0000062) links this process to earlier processes such as
  # heat treatment or sample preparation — not to the specimen itself.
  # Hidden from the form: it is an advanced temporal provenance link that most
  # users do not need and that can be added directly to the JSON-LD output
  # when required.
  preceded_by:
    title: Preceded By
    readOnly: true
    type: array
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  has_process_attribute:
    title: Test Conditions
    description: >-
      Quantitative conditions for this test (strain rate, temperature, gauge length, etc.)
      and the test standard applied.
      Maps to pmdco:PMD_0000009 "has process attribute".
    type: array
    items:
      type: object
      title: Process Attribute
      required:
        - type
        - id
        - parameter_label
      properties:
        type:
          title: Type
          type: string
          readOnly: true
          const: "pmdco:PMD_0000013"
          default: "pmdco:PMD_0000013"
          options:
            enum_titles:
              - pmdco:ParameterSpecification
        id:
          title: ID
          type: string
          readOnly: true
          default: condition-1
        parameter_label:
          title: Condition Name
          type: string
          enum:
            - Strain Rate
            - Test Speed
            - Temperature
            - Gauge Length
            - Pre-load
          options:
            enum_titles:
              - Strain Rate
              - Test Speed
              - Temperature
              - Gauge Length
              - Pre-load
        parameter_value:
          title: Value
          type: number
        parameter_unit:
          title: Unit
          type: string
          enum:
            - uqudt:PER-SEC
            - uqudt:MilliM-PER-MIN
            - uqudt:MilliM-PER-SEC
            - uqudt:DEG_C
            - uqudt:K
            - uqudt:MilliM
            - uqudt:N
            - uqudt:MegaPascal
          options:
            enum_titles:
              - "1/s (strain rate)"
              - "mm/min (speed)"
              - "mm/s (speed)"
              - "°C (Celsius)"
              - "K (Kelvin)"
              - "mm (length)"
              - "N (Newton)"
              - "MPa (megapascal)"
          x-depends-on:
            field: parameter_label
            values:
              Strain Rate: [uqudt:PER-SEC]
              Test Speed: [uqudt:MilliM-PER-MIN, uqudt:MilliM-PER-SEC]
              Temperature: [uqudt:DEG_C, uqudt:K]
              Gauge Length: [uqudt:MilliM]
              Pre-load: [uqudt:N, uqudt:MegaPascal]
    default: []

  measured_properties:
    title: Measured Properties
    description: >-
      Mechanical properties determined from this tensile test.
      Each entry is a measurement datum (IAO_0000109) with a name label,
      a reference back to the specimen (is_about), a reference to the
      quality being measured (is_quality_measurement_of), and an embedded
      scalar value specification carrying the numeric value and unit.
    type: array
    items:
      type: object
      title: Measurement Result
      required:
        - type
        - id
        - label
        - has_value_spec
      properties:
        type:
          title: Type
          type: string
          readOnly: true
          const: "obo:IAO_0000109"
          default: "obo:IAO_0000109"
          options:
            enum_titles:
              - iao:MeasurementDatum
        id:
          title: Datum ID
          type: string
          readOnly: true
          default: result-1-smd
        label:
          title: Property Name
          description: Measured mechanical property.
          type: string
          enum:
            - Yield Strength (Re)
            - Upper Yield Strength (ReH)
            - Lower Yield Strength (ReL)
            - Proof Strength (Rp0.2)
            - Tensile Strength (Rm)
            - Elongation After Fracture (A)
            - Reduction of Area (Z)
            - Young's Modulus (E)
            - Uniform Elongation (Ag)
          options:
            enum_titles:
              - Yield Strength (Re)
              - Upper Yield Strength (ReH)
              - Lower Yield Strength (ReL)
              - Proof Strength (Rp0.2)
              - Tensile Strength (Rm)
              - Elongation After Fracture (A)
              - Reduction of Area (Z)
              - Young's Modulus (E)
              - Uniform Elongation (Ag)
        is_about:
          title: Is About (Specimen)
          description: IRI of the specimen this datum was measured on (auto-filled).
          type: string
          readOnly: true
          default: ""
        is_quality_measurement_of:
          title: Quality Measured
          description: IRI of the quality this datum measures (derived by transformer).
          type: string
          readOnly: true
          default: ""
        has_value_spec:
          title: Value Specification
          description: Scalar value specification holding the numeric value and unit.
          type: object
          required:
            - type
            - id
            - result_value
            - result_unit
          properties:
            type:
              title: Type
              type: string
              readOnly: true
              const: "obo:OBI_0001931"
              default: "obo:OBI_0001931"
              options:
                enum_titles:
                  - obi:ScalarValueSpecification
            id:
              title: Value Spec ID
              type: string
              readOnly: true
              default: result-1-svs
            result_value:
              title: Value
              description: Numeric measurement value.
              type: number
              minimum: 0
            result_unit:
              title: Unit
              type: string
              enum:
                - uqudt:MegaPascal
                - uqudt:GigaPascal
                - uqudt:PERCENT
              options:
                enum_titles:
                  - MPa (megapascal)
                  - GPa (gigapascal)
                  - "% (percent)"
            specifies_value_of:
              title: Specifies Value Of
              description: IRI of the quality this value quantifies (derived by transformer).
              type: string
              readOnly: true
              default: ""
            is_about:
              title: Is About (Specimen)
              description: IRI of the specimen (auto-filled).
              type: string
              readOnly: true
              default: ""
    default: []
