# OO-LD Schema for CharacterizationGeneric (PMDCo pattern)
# Ontology: Platform MaterialDigital Core Ontology (PMDCo)
#   https://w3id.org/pmd/co/
#
# PMDCo patterns combined:
#   - Input and Output of Processes
#     https://github.com/materialdigital/core-ontology/tree/main/patterns/input%20and%20output%20of%20processes
#   - Measurement
#     https://github.com/materialdigital/core-ontology/tree/main/patterns/measurement
#
# Graph pattern:
#
#   Assay  (obi:OBI_0000070)
#     rdfs:label ──────────────────────────────────────── name string
#     rdfs:comment ────────────────────────────────────── description string  (optional)
#     has_specified_input ────────────────────────────► Material/Specimen IRI  [× 0..N]    (obi:OBI_0000293)
#     has_specified_output ───────────────────────────► Dataset/Specimen IRI  [× 0..N]     (obi:OBI_0000299)
#     preceded_by ────────────────────────────────────► Assay IRI  [× 0..N]  (optional)
#     has_process_attribute ─────────────────────────► ParameterSpecification (pmdco:PMD_0000013)  [× 0..N]  (optional)
#       rdfs:label ──────── parameter name
#       qudt:value ──────── numeric value (xsd:double)
#       qudt:hasUnit ─────── QUDT unit IRI
#     measured_properties ───────────────────────────► MeasurementDatum (iao:IAO_0000109)  [× 0..N]  (obi:OBI_0000299)
#       rdfs:label ─────────── result name
#       iao:IAO_0000136 ─────► Specimen IRI  (is_about, optional)
#       obi:OBI_0001938 ─────► ScalarValueSpecification (obi:OBI_0001931)
#         obi:OBI_0001937 ──── numeric value (xsd:double)
#         iao:IAO_0000039 ──── QUDT unit IRI
#
# Design notes:
#   - OBI Assay (OBI_0000070) is the canonical class for planned characterization
#     processes in the PMDCo ecosystem.  It is the superclass from which domain-
#     specific characterization schemas (e.g. tensile test, hardness test) inherit.
#   - has_specified_output (obi:OBI_0000299) links to output Dataset/Specimen KItem IRIs.
#   - measured_properties uses the same obi:OBI_0000299 predicate but as embedded
#     MeasurementDatum nodes — valid because JSON-LD context keys differ (@type:@id vs node).
#   - Specialised schemas may override label enum and add domain-specific fields.
#   - This schema is the characterization counterpart of manufacturing/record/PMDCo/.
#     The structural pattern (inputs, conditions, chain position) is identical;
#     only the root class differs.

"@context":
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  conforms_to:
    "@id": "http://purl.org/dc/terms/conformsTo"
    "@type": "@id"
  obo: "http://purl.obolibrary.org/obo/"
  obi:
    "@id": "http://purl.obolibrary.org/obo/OBI_"
    "@prefix": true
  bfo:
    "@id": "http://purl.obolibrary.org/obo/BFO_"
    "@prefix": true
  chameo: "https://w3id.org/emmo/domain/characterisation-methodology/chameo#"
  pmdco: "https://w3id.org/pmd/co/"
  qudt: "http://qudt.org/schema/qudt/"
  uqudt: "http://qudt.org/vocab/unit/"
  type: "@type"
  id: "@id"
  label:
    "@id": "rdfs:label"
  # description → rdfs:comment removed: process-step already maps notes → rdfs:comment
  # Redefining it here causes a duplicate "Notes/Description" field in the form.
  measurement_device:
    "@id": "chameo:usesInstrument"
    "@type": "@id"
  has_specified_input:
    "@id": "obi:0000293"   # OBI_0000293  has_specified_input
    "@type": "@id"
    "@container": "@set"
  has_specified_output:
    "@id": "obi:0000299"   # OBI_0000299  has_specified_output
    "@type": "@id"
    "@container": "@set"
  preceded_by:
    "@id": "bfo:0000062"   # BFO_0000062  preceded_by
    "@type": "@id"
    "@container": "@set"
  # pmdco:PMD_0000009 "has process attribute" — directly links process to ParameterSpecification nodes
  has_process_attribute:
    "@id": "pmdco:PMD_0000009"
    "@container": "@set"
  parameter_label:
    "@id": "rdfs:label"
  parameter_type:
    "@id": "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"
    "@type": "@id"
  parameter_value:
    "@id": "qudt:value"
    "@type": "xsd:double"
  parameter_unit:
    "@id": "qudt:hasUnit"
    "@type": "@id"
  # obi:OBI_0000299 : inline MeasurementDatum result nodes (same IRI as has_specified_output
  # but no @type:@id — objects are embedded node objects, not IRI strings)
  measured_properties:
    "@id": "http://purl.obolibrary.org/obo/OBI_0000299"
    "@container": "@set"
  # rdf:type : property class IRI from characterization-result vocabulary (mirrors parameter_type)
  result_type:
    "@id": "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"
    "@type": "@id"
  # iao:IAO_0000136 : datum is_about the quality individual (embedded node, not IRI ref)
  is_about:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000136"
  # rdf:type on quality individual (vocabulary-resolved class IRI)
  quality_type:
    "@id": "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"
    "@type": "@id"
  # ro:RO_0000080 : quality individual is quality of specimen
  quality_of:
    "@id": "http://purl.obolibrary.org/obo/RO_0000080"
    "@type": "@id"
  # obi:OBI_0001938 : scalar value specification embedded in each datum
  has_value_spec:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001938"
  # obi:OBI_0001937 : numeric value predicate for ScalarValueSpecification
  result_value:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001937"
    "@type": "xsd:double"
  # iao:IAO_0000039 : unit IRI
  result_unit:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000039"
    "@type": "@id"
  # obi:OBI_0001927 : value spec points back to the quality it quantifies
  specifies_value_of:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001927"
    "@type": "@id"

allOf:
  - $ref: "../../../../process-step/PMDCo/specs/schema.oold.yaml"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: Schema for an obi:Assay (generic characterization record)
x-schema-version: '0.4.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/kiran/schemas/characterization/generic/PMDCo/specs/schema.oold.generated.json'
x-maturity: 'draft'
x-process-step:
  category: characterization
title: Characterization Generic
type: object
required:
  - type
  - id
  - label

properties:

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["obi:0000070"]
    default: ["obi:0000070"]
    options:
      enum_titles:
        - obi:Assay

  id:
    title: ID
    description: Identifier for this characterization record instance; managed by the consumer.
    type: string
    readOnly: true
    default: characterization-generic

  label:
    title: Name
    description: >-
      Human-readable name for this characterization record
      (e.g. "Tensile test specimen 1", "Hardness measurement batch A").
    type: string

  measurement_device:
    title: Measurement Device
    description: >-
      The instrument used to perform this characterization step.
      Links to a measurement-device KItem (chameo:usesInstrument).
    type: string
    format: kitem
    x-kitem:
      ktypeIds: [measurement-device]

  has_specified_input:
    title: Inputs
    description: >-
      Specimens or materials characterised by this step.
      Select the corresponding entries from the knowledge graph.
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [specimen, material]
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  has_specified_output:
    title: Outputs
    description: >-
      The post-test specimen or dataset produced by this characterization step,
      e.g. a deformed specimen returned after testing or a raw measurement file.
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [specimen, dataset]
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  preceded_by:
    title: Preceded By
    description: >-
      Processes that directly precede this step in the workflow.
      Select the corresponding process entries from the knowledge graph.
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [process]
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  has_process_attribute:
    title: Process Attributes / Parameters
    description: >-
      Quantitative conditions and protocol parameters for this characterization step,
      modelled as PMDCo ParameterSpecification nodes (PMD_0000013) linked directly
      via has_process_attribute (PMD_0000009).
    type: array
    items:
      type: object
      title: Parameter
      required:
        - type
        - id
        - parameter_type
      properties:
        type:
          title: Type
          type: array
          items:
            type: string
          readOnly: true
          const: ["pmdco:PMD_0000013"]
          default: ["pmdco:PMD_0000013"]
          options:
            enum_titles:
              - pmdco:ParameterSpecification
        id:
          title: ID
          description: Identifier for this parameter instance; managed by the consumer.
          type: string
          readOnly: true
          default: param-1
        parameter_type:
          title: Parameter Name
          description: Search and select a parameter type from the process-parameter vocabulary.
          type: string
          x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/process-parameter/use-cases/all/terms"
        parameter_label:
          title: Parameter Label
          description: Human-readable label — set by transform, not edited manually.
          type: string
          options:
            hidden: true
        parameter_value:
          title: Value
          description: Numeric magnitude of the parameter.
          type: number
        parameter_unit:
          title: Unit
          description: Search and select a QUDT unit from the vocabulary service.
          type: string
          x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/measurement-unit/use-cases/base/terms"
    default: []

  measured_properties:
    title: Measured Properties
    description: >-
      Scalar results identified from this characterization step.
      Each entry is a MeasurementDatum (IAO_0000109) with a property name,
      numeric value, and unit. Optionally links back to the specimen via is_about.
      Maps to obi:OBI_0000299 "has specified output" as inline embedded nodes
      (distinct from has_specified_output which carries KItem IRI links).
    type: array
    items:
      type: object
      title: Measurement Result
      required:
        - type
        - id
        - label
        - has_value_spec
      properties:
        type:
          title: Type
          type: array
          items:
            type: string
          readOnly: true
          const: ["obo:IAO_0000109"]
          default: ["obo:IAO_0000109"]
          options:
            enum_titles:
              - iao:MeasurementDatum
        id:
          title: Datum ID
          description: Identifier for this result node; managed by the consumer.
          type: string
          readOnly: true
          default: result-1-smd
        label:
          title: Property Name
          type: string
          x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/characterization-result/use-cases/base/terms"
        is_about:
          title: Quality Individual
          description: >-
            Quality individual typed with the measured property class.
            Populated automatically by the transform — do not edit manually.
          type: object
          properties:
            quality_type:
              title: Quality Class
              type: string
              x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/characterization-result/use-cases/base/terms"
              options:
                hidden: true
            id:
              title: Quality Individual ID
              type: string
              readOnly: true
              default: result-1-quality
              options:
                hidden: true
            quality_of:
              title: Specimen IRI
              type: string
              options:
                hidden: true
        has_value_spec:
          title: Value Specification
          description: Scalar value specification holding the numeric value and unit.
          type: object
          required:
            - type
            - id
            - result_value
            - result_unit
          properties:
            type:
              title: Type
              type: array
              items:
                type: string
              readOnly: true
              const: ["obo:OBI_0001931"]
              default: ["obo:OBI_0001931"]
              options:
                enum_titles:
                  - obi:ScalarValueSpecification
            id:
              title: Value Spec ID
              type: string
              readOnly: true
              default: result-1-svs
            result_value:
              title: Value
              description: Numeric measurement value.
              type: number
            result_unit:
              title: Unit
              description: Search and select a QUDT unit from the vocabulary service.
              type: string
              x-vocabulary: "https://vocabulary.materials-data.space/api/vocabulary/namespaces/measurement-unit/use-cases/base/terms"
    default: []
