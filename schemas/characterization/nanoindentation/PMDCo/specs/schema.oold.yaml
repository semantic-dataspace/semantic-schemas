# OO-LD Schema for Nanoindentation Experiment (PMDCo / CHAMEO pattern)
# Ontology: CHAMEO (Characterisation MEthodology Ontology)
#   https://w3id.org/emmo/domain/characterisation-methodology/chameo#
# PMDCo measurement pattern (inherited via process-step):
#   https://github.com/materialdigital/core-ontology/tree/main/patterns/measurement
#
# Full graph pattern:
#
#   chameo:Nanoindentation
#     rdfs:label ─────────────────────────────────── name string
#     dcterms:date ───────────────────────────────── execution date
#     prov:wasAssociatedWith ──────────────────────> Operator IRI
#     schema:instrument ───────────────────────────> Instrument IRI
#     obi:OBI_0000293 (has_specified_input) ───────> Specimen IRI
#     obi:OBI_0000299 (has_specified_output) ──────> Dataset IRI
#     pmdco:PMD_0000009 (has_process_attribute) ───> ParameterSpecification [x 0..N]
#     obi:OBI_0000299 (measured_properties) ──────> MeasurementDatum [x 0..N]
#       iao:IAO_0000136 (is_about) ──────────────> Specimen IRI
#       obi:OBI_0001938 (has_value_spec) ───────> ScalarValueSpecification
#         obi:OBI_0001937 (result_value) ───── xsd:double
#         iao:IAO_0000039 (result_unit) ─────── unit IRI (QUDT)

"@context":
  # Prefixes not declared in characterization/generic (inherited via allOf)
  rdfs:    "http://www.w3.org/2000/01/rdf-schema#"
  xsd:     "http://www.w3.org/2001/XMLSchema#"
  dcterms: "http://purl.org/dc/terms/"
  prov:    "http://www.w3.org/ns/prov#"
  schema:  "https://schema.org/"
  pmdco:   "https://w3id.org/pmd/co/"
  qudt:    "http://qudt.org/schema/qudt/"
  uqudt:   "http://qudt.org/vocab/unit/"
  chameo:  "https://w3id.org/emmo/domain/characterisation-methodology/chameo#"
  nanoind: "https://w3id.org/emmo/domain/nanoindentation#"
  # Term mappings — only those not already provided by characterization/generic:
  #   type, id, label, has_specified_input, has_specified_output, preceded_by,
  #   parameter_label, parameter_value, has_process_condition → inherited from generic
  notes:
    "@id": "rdfs:comment"
  date:
    "@id": "dcterms:date"
    "@type": "xsd:dateTime"
  operator:
    "@id": "http://www.w3.org/ns/prov#wasAssociatedWith"
    "@type": "@id"
  instrument:
    "@id": "https://schema.org/instrument"
    "@type": "@id"
  has_process_attribute:
    "@id": "pmdco:PMD_0000009"
    "@type": "@id"
    "@container": "@set"
  parameter_unit:
    "@id": "qudt:hasUnit"
    "@type": "@id"
  measured_properties:
    "@id": "http://purl.obolibrary.org/obo/OBI_0000299"
    "@container": "@set"
  is_about:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000136"
    "@type": "@id"
  is_quality_measurement_of:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000221"
    "@type": "@id"
  has_value_spec:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001938"
  result_value:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001937"
    "@type": "xsd:double"
  result_unit:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000039"
    "@type": "@id"
  specifies_value_of:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001927"
    "@type": "@id"
  test_temperature:
    "@id": "nanoind:testTemperature"
    "@type": "xsd:double"
  test_humidity:
    "@id": "nanoind:testRelativeHumidity"
    "@type": "xsd:double"

allOf:
  - $ref: "../../../generic/PMDCo/specs/schema.oold.yaml"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: PMDCo / CHAMEO pattern schema for a nanoindentation experiment session
x-schema-version: '0.1.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/nanoindentation-PMDCo-v0.1.0/schemas/characterization/nanoindentation/PMDCo/specs/schema.oold.generated.json'
x-maturity: 'draft'
x-process-step:
  category: characterization
title: Nanoindentation Experiment (PMDCo)
type: object

required:
  - type
  - id
  - label

properties:

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["chameo:Nanoindentation"]
    default: ["chameo:Nanoindentation"]
    options:
      enum_titles:
        - chameo:Nanoindentation

  id:
    title: ID
    type: string
    readOnly: true
    default: nanoindentation-experiment

  label:
    title: Experiment Name
    type: string

  notes:
    title: Notes
    type: string
    format: textarea

  date:
    title: Test Date
    type: string
    format: date-time

  has_specified_input:
    title: Specimen
    x-ktype: [nanoindentation-specimen, specimen]
    type: array
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  has_specified_output:
    title: Summary Dataset
    x-ktype: [dataset]
    type: array
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  operator:
    title: Operator
    x-ktype: [expert]
    type: string
    format: uri

  instrument:
    title: Instrument
    x-ktype: [characterisation-measurement-instrument]
    type: string
    format: uri

  instrument_serial:
    title: Instrument Serial Number
    type: string

  control_mode:
    title: Control Mode
    type: string
    enum:
      - Depth-controlled
      - Load-controlled
      - Constant Strain Rate
      - Oscillating (CSM)

  indenter_geometry:
    title: Indenter Geometry
    type: string
    enum:
      - Berkovich
      - Cube Corner
      - Spherical
      - Conical
      - Vickers
      - Flat Punch
      - Other

  indenter_material:
    title: Indenter Material
    type: string

  analysis_method:
    title: Analysis Method
    type: string
    enum:
      - Oliver & Pharr
      - Doerner & Nix
      - ISO 14577
      - Continuous Stiffness (CSM)

  unload_fit_range:
    title: Unload Fit Range
    description: "e.g. [40%, 98%]"
    type: string

  test_standard:
    title: Test Standard
    description: "e.g. ISO 14577-1:2015, ASTM E2546"
    type: string

  tip_area_function:
    title: Tip Area Function Reference
    type: string

  test_temperature:
    title: Test Temperature (°C)
    description: "Ambient temperature during measurement. ISO 14577: 23 ± 5 °C."
    type: number

  test_humidity:
    title: Relative Humidity (%)
    description: "Ambient relative humidity during measurement. ISO 14577: 45 ± 10 %."
    type: number
    minimum: 0
    maximum: 100

  has_process_attribute:
    title: Test Protocol (Numeric Conditions)
    description: >-
      Quantitative test parameters as ParameterSpecification nodes (pmdco:PMD_0000013).
    type: array
    items:
      type: object
      title: Test Parameter
      required:
        - type
        - id
        - parameter_label
      properties:
        type:
          title: Type
          type: array
          items:
            type: string
          readOnly: true
          const: ["pmdco:PMD_0000013"]
          default: ["pmdco:PMD_0000013"]
          options:
            enum_titles:
              - pmdco:ParameterSpecification
        id:
          title: ID
          type: string
          readOnly: true
          default: condition-1
        parameter_label:
          title: Parameter Name
          type: string
          enum:
            - Max Depth
            - Max Load
            - Loading Rate
            - Hold Time
            - Acquisition Rate
            - Assumed Poisson's Ratio
        parameter_value:
          title: Value
          type: number
        parameter_unit:
          title: Unit
          type: string
          enum:
            - uqudt:MicroM
            - uqudt:MilliN
            - uqudt:PER-SEC
            - uqudt:SEC
            - uqudt:HZ
            - uqudt:UNITLESS
          options:
            enum_titles:
              - "um (micrometre)"
              - "mN (millinewton)"
              - "1/s (per second)"
              - "s (second)"
              - "Hz (hertz)"
              - "- (dimensionless)"
          x-depends-on:
            field: parameter_label
            values:
              Max Depth:               [uqudt:MicroM]
              Max Load:                [uqudt:MilliN]
              Loading Rate:            [uqudt:PER-SEC]
              Hold Time:               [uqudt:SEC]
              Acquisition Rate:        [uqudt:HZ]
              Assumed Poisson's Ratio: [uqudt:UNITLESS]
    default: []

  measured_properties:
    title: Summary Statistics
    description: >-
      Aggregate results across all valid indentations.
      Each entry is a MeasurementDatum (IAO_0000109) with an embedded
      ScalarValueSpecification (OBI_0001931).
    type: array
    items:
      type: object
      title: Summary Result
      required:
        - type
        - id
        - label
        - has_value_spec
      properties:
        type:
          title: Type
          type: array
          items:
            type: string
          readOnly: true
          const: ["obo:IAO_0000109"]
          default: ["obo:IAO_0000109"]
          options:
            enum_titles:
              - iao:MeasurementDatum
        id:
          title: Datum ID
          type: string
          readOnly: true
          default: result-1-smd
        label:
          title: Result Name
          type: string
          enum:
            - Mean Hardness HIT
            - Std Dev Hardness HIT
            - Mean Elastic Modulus EIT
            - Std Dev Elastic Modulus EIT
            - Mean Maximum Depth hmax
            - Number of Valid Indentations
        is_about:
          title: Is About (Specimen)
          type: string
          readOnly: true
          default: ""
        has_value_spec:
          title: Value Specification
          type: object
          required:
            - type
            - id
            - result_value
            - result_unit
          properties:
            type:
              title: Type
              type: array
              items:
                type: string
              readOnly: true
              const: ["obo:OBI_0001931"]
              default: ["obo:OBI_0001931"]
              options:
                enum_titles:
                  - obi:ScalarValueSpecification
            id:
              title: Value Spec ID
              type: string
              readOnly: true
              default: result-1-svs
            result_value:
              title: Value
              type: number
              minimum: 0
            result_unit:
              title: Unit
              type: string
              enum:
                - uqudt:GigaPA
                - uqudt:MicroM
                - uqudt:UNITLESS
              options:
                enum_titles:
                  - GPa (gigapascal)
                  - "um (micrometre)"
                  - "- (count / dimensionless)"
              x-depends-on:
                field: label
                values:
                  Mean Hardness HIT:             [uqudt:GigaPA]
                  Std Dev Hardness HIT:          [uqudt:GigaPA]
                  Mean Elastic Modulus EIT:      [uqudt:GigaPA]
                  Std Dev Elastic Modulus EIT:   [uqudt:GigaPA]
                  Mean Maximum Depth hmax:       [uqudt:MicroM]
                  Number of Valid Indentations:  [uqudt:UNITLESS]
            specifies_value_of:
              title: Specifies Value Of
              type: string
              readOnly: true
              default: ""
            is_about:
              title: Is About (Specimen)
              type: string
              readOnly: true
              default: ""
    default: []
