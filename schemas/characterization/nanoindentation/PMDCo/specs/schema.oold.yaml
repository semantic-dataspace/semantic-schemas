# OO-LD Schema for Nanoindentation Characterization Process (PMDCo / CHAMEO pattern)
#
# Inheritance chain:
#   nanoindentation/PMDCo
#     → characterization/generic/PMDCo  (allOf $ref)
#       → process-step/PMDCo            (allOf $ref)
#
# Fields inherited (do NOT redefine here):
#   process-step:    type, id, label, notes, date, operator, instrument,
#                    has_specified_input, has_specified_output, preceded_by
#   generic:         has_process_condition
#
# Form sections (via top-level type:object, same mechanism as chemical-composition):
#   Main section:    label, notes, date, operator, instrument, preceded_by,
#                    has_specified_input, has_specified_output, raw_data_files,
#                    instrument_serial, control_mode, indenter_geometry,
#                    indenter_material, analysis_method, unload_fit_range,
#                    test_standard, tip_area_function, test_temperature, test_humidity
#   Section "Test Protocol Parameters"  (test_conditions, type:object)
#   Section "Summary Statistics"        (summary_results,  type:object)
#
# Named sections use EXISTING PMDCo/OBI IRIs — no new vocabulary terms needed:
#   test_conditions  → pmdco:PMD_0000016  (has_process_condition)
#                       inner array uses pmdco:PMD_0000009  (has_process_attribute)
#   summary_results  → obi:0000299        (has_specified_output)
#                       inner array uses  obo:RO_0002351    (has_member)
#
# Graph pattern:
#
#   Nanoindentation (chameo:Nanoindentation)
#     obi:OBI_0000293  → specimen/material KItems          (has_specified_input)
#     obi:OBI_0000299  → post-test specimen + dataset KItems (has_specified_output)
#     prov:generated   → per-indent raw file KItems
#     dsms:instrumentSerialNumber  "..."
#     dsms:controlMode             "..."
#     dsms:indenterGeometry        "..."
#     dsms:indenterMaterial        "..."
#     dsms:analysisMethod          "..."
#     dsms:unloadFitRange          "..."
#     dsms:testStandard            "..."
#     dsms:tipAreaFunction         "..."
#     dsms:testTemperature         xsd:double
#     dsms:testRelativeHumidity    xsd:double
#     pmdco:PMD_0000016 → <test_conditions_node>
#       pmdco:PMD_0000009 → ParameterSpecification nodes  (max depth, max load, …)
#     obi:OBI_0000299  → <summary_results_node>
#       ro:RO_0002351  → MeasurementDatum nodes           (mean HIT, mean EIT, …)

"@context":
  chameo:  "https://w3id.org/emmo/domain/characterisation-methodology/chameo#"
  nanoind: "https://w3id.org/emmo/domain/nanoindentation#"
  uqudt:   "http://qudt.org/vocab/unit/"
  obo:     "http://purl.obolibrary.org/obo/"
  pmdco:   "https://w3id.org/pmd/co/"
  dnano:   "https://w3id.org/dsms/nanoindentation#"

  raw_data_files:
    "@id": "http://www.w3.org/ns/prov#generated"
    "@type": "@id"
    "@container": "@set"

  # ── Flat scalar properties (main section) ───────────────────────────────────
  instrument_serial:
    "@id": "dnano:instrumentSerialNumber"
  control_mode:
    "@id": "dnano:controlMode"
  indenter_geometry:
    "@id": "dnano:indenterGeometry"
  indenter_material:
    "@id": "dnano:indenterMaterial"
  analysis_method:
    "@id": "dnano:analysisMethod"
  unload_fit_range:
    "@id": "dnano:unloadFitRange"
  test_standard:
    "@id": "dnano:testStandard"
  tip_area_function:
    "@id": "dnano:tipAreaFunction"
  test_temperature:
    "@id": "dnano:testTemperature"
    "@type": "xsd:double"
  test_humidity:
    "@id": "dnano:testRelativeHumidity"
    "@type": "xsd:double"

  # ── Section wrappers using existing IRIs (no new vocab terms) ───────────────
  # test_conditions → pmdco:PMD_0000016 (has_process_condition)
  # summary_results → obi:0000299       (has_specified_output, same IRI as the kitem array;
  #                   both are valid outputs — one external KItems, one inline data node)
  test_conditions:
    "@id": "pmdco:PMD_0000016"
    "@type": "@id"
  summary_results:
    "@id": "http://purl.obolibrary.org/obo/OBI_0000299"
    "@type": "@id"

  # ── test_conditions interior: has_process_attribute array ────────────────────
  has_process_attribute:
    "@id": "pmdco:PMD_0000009"
    "@type": "@id"
    "@container": "@set"
  parameter_label:
    "@id": "http://www.w3.org/2000/01/rdf-schema#label"
  parameter_value:
    "@id": "http://qudt.org/schema/qudt/value"
    "@type": "xsd:double"
  parameter_unit:
    "@id": "http://qudt.org/schema/qudt/hasUnit"

  # ── summary_results interior: measured_properties array ──────────────────────
  # has_member (RO_0002351): the summary results node has MeasurementDatum members
  measured_properties:
    "@id": "obo:RO_0002351"
    "@type": "@id"
    "@container": "@set"
  has_value_spec:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001938"
  result_value:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001937"
    "@type": "xsd:double"
  result_unit:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000039"
    "@type": "@id"

allOf:
  - $ref: "../../../generic/PMDCo/specs/schema.oold.yaml"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: PMDCo / CHAMEO pattern schema for a nanoindentation characterization process
x-schema-version: '0.2.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/nanoindentation-PMDCo-v0.2.0/schemas/characterization/nanoindentation/PMDCo/specs/schema.oold.yaml'
x-maturity: 'draft'
x-process-step:
  category: characterization
title: Nanoindentation Characterization Process (PMDCo)
type: object

required:
  - type
  - id
  - label

properties:

  # ── Root type override ──────────────────────────────────────────────────────

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["chameo:Nanoindentation"]
    default: ["chameo:Nanoindentation"]
    options:
      enum_titles:
        - chameo:Nanoindentation

  # ── KItem overrides (narrowed filters, fixed title) ───────────────────────

  has_specified_input:
    title: Inputs
    description: Specimen(s) or material(s) tested in this nanoindentation session.
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [specimen, material]
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  has_specified_output:
    title: Outputs
    description: >-
      Link both: (1) post-test specimen (supports PMDCo state-change queries);
      (2) aggregated summary dataset.
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [specimen, nanoindentation-dataset, dataset]
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  raw_data_files:
    title: Raw Measurement Files
    description: >-
      Per-indent raw files generated by the instrument. Link via prov:generated
      (generated artefacts, not planned outputs).
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [nanoindentation-dataset, dataset]
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  # ── Flat scalars (main section) ─────────────────────────────────────────────

  instrument_serial:
    title: Instrument Serial Number
    type: string

  control_mode:
    title: Control Mode
    type: string
    enum:
      - Depth-controlled
      - Load-controlled
      - Constant Strain Rate
      - Oscillating (CSM)

  indenter_geometry:
    title: Indenter Geometry
    type: string
    enum:
      - Berkovich
      - Cube Corner
      - Spherical
      - Conical
      - Vickers
      - Flat Punch
      - Other

  indenter_material:
    title: Indenter Material
    description: "e.g. Diamond, Sapphire, Steel"
    type: string

  analysis_method:
    title: Analysis Method
    type: string
    enum:
      - Oliver & Pharr
      - Doerner & Nix
      - ISO 14577
      - Continuous Stiffness (CSM)

  unload_fit_range:
    title: Unload Fit Range
    description: "Power-law fit range on unloading curve, e.g. 40%–98%"
    type: string

  test_standard:
    title: Test Standard
    description: "e.g. ISO 14577-1:2015, ASTM E2546"
    type: string

  tip_area_function:
    title: Tip Area Function Reference
    description: "Identifier or description of the calibration used"
    type: string

  test_temperature:
    title: Test Temperature (°C)
    description: "Ambient temperature. ISO 14577: 23 ± 5 °C."
    type: number

  test_humidity:
    title: Relative Humidity (%)
    description: "Ambient relative humidity. ISO 14577: 45 ± 10 %."
    type: number
    minimum: 0
    maximum: 100

  # ── Section: Test Protocol Parameters ────────────────────────────────────────
  # type:object → named WebformSection "Test Protocol Parameters"
  # Wrapper predicate: pmdco:PMD_0000016 (has_process_condition) — existing PMDCo IRI
  # Array inside uses:  pmdco:PMD_0000009 (has_process_attribute) — different predicate

  test_conditions:
    title: Test Protocol Parameters
    type: object
    required:
      - id
    properties:
      id:
        title: ID
        type: string
        readOnly: true
        default: test-protocol
      has_process_attribute:
        title: Parameters
        description: >-
          Numeric test protocol parameters. Each row is a PMDCo
          ParameterSpecification (PMD_0000013). Select the parameter name,
          enter the value, and select the unit.
        type: array
        items:
          type: object
          title: Parameter
          required:
            - type
            - id
            - parameter_label
            - parameter_value
            - parameter_unit
          properties:
            type:
              title: Type
              type: array
              items: {type: string}
              readOnly: true
              const: ["pmdco:PMD_0000013"]
              default: ["pmdco:PMD_0000013"]
              options:
                enum_titles:
                  - pmdco:ParameterSpecification
            id:
              title: ID
              type: string
              readOnly: true
              default: param-1
            parameter_label:
              title: Parameter
              type: string
              enum:
                - Max Depth
                - Min Depth
                - Max Load
                - Loading Rate
                - Hold Time at Max Load
                - Acquisition Rate
                - Assumed Poisson's Ratio
            parameter_value:
              title: Value
              type: number
              minimum: 0
            parameter_unit:
              title: Unit
              type: string
              enum:
                - uqudt:MicroM
                - uqudt:MilliN
                - uqudt:PER-SEC
                - uqudt:SEC
                - uqudt:HZ
                - uqudt:UNITLESS
              options:
                enum_titles:
                  - µm (micrometre)
                  - mN (millinewton)
                  - 1/s (per second)
                  - s (second)
                  - Hz (hertz)
                  - "– (dimensionless)"
              x-depends-on:
                field: parameter_label
                values:
                  Max Depth:                [uqudt:MicroM]
                  Min Depth:                [uqudt:MicroM]
                  Max Load:                 [uqudt:MilliN]
                  Loading Rate:             [uqudt:PER-SEC]
                  Hold Time at Max Load:    [uqudt:SEC]
                  Acquisition Rate:         [uqudt:HZ]
                  Assumed Poisson's Ratio:  [uqudt:UNITLESS]
        default: []

  # ── Section: Summary Statistics ───────────────────────────────────────────────
  # type:object → named WebformSection "Summary Statistics"
  # Wrapper predicate: obi:OBI_0000299 (has_specified_output) — existing OBI IRI
  # Array inside uses:  obo:RO_0002351  (has_member) — existing RO IRI

  summary_results:
    title: Summary Statistics
    type: object
    required:
      - id
    properties:
      id:
        title: ID
        type: string
        readOnly: true
        default: summary-results
      measured_properties:
        title: Summary Results
        description: >-
          Aggregate results across all valid indentations. Each row is a
          MeasurementDatum (IAO_0000109) with an embedded ScalarValueSpec
          (OBI_0001931). Select the result name; unit is set automatically.
        type: array
        items:
          type: object
          title: Summary Result
          required:
            - type
            - id
            - label
            - has_value_spec
          properties:
            type:
              title: Type
              type: array
              items: {type: string}
              readOnly: true
              const: ["obo:IAO_0000109"]
              default: ["obo:IAO_0000109"]
              options:
                enum_titles:
                  - iao:MeasurementDatum
            id:
              title: Datum ID
              type: string
              readOnly: true
              default: result-1-smd
            label:
              title: Result Name
              type: string
              enum:
                - Mean Hardness HIT
                - Std Dev Hardness HIT
                - Mean Elastic Modulus EIT
                - Std Dev Elastic Modulus EIT
                - Mean Indentation Modulus Er
                - Std Dev Indentation Modulus Er
                - Mean Reduced Modulus E*
                - Std Dev Reduced Modulus E*
                - Mean Vickers Equivalent HVIT
                - Std Dev Vickers Equivalent HVIT
                - Mean Maximum Depth hmax
                - Std Dev Maximum Depth hmax
                - Number of Valid Indentations
            has_value_spec:
              title: Value Specification
              type: object
              required:
                - type
                - id
                - result_value
                - result_unit
              properties:
                type:
                  title: Type
                  type: array
                  items: {type: string}
                  readOnly: true
                  const: ["obo:OBI_0001931"]
                  default: ["obo:OBI_0001931"]
                  options:
                    enum_titles:
                      - obi:ScalarValueSpecification
                id:
                  title: Value Spec ID
                  type: string
                  readOnly: true
                  default: result-1-svs
                result_value:
                  title: Value
                  type: number
                  minimum: 0
                result_unit:
                  title: Unit
                  type: string
                  enum:
                    - uqudt:GigaPA
                    - uqudt:MicroM
                    - uqudt:UNITLESS
                  options:
                    enum_titles:
                      - GPa (gigapascal)
                      - µm (micrometre)
                      - "– (count / dimensionless)"
                  x-depends-on:
                    field: label
                    values:
                      Mean Hardness HIT:             [uqudt:GigaPA]
                      Std Dev Hardness HIT:          [uqudt:GigaPA]
                      Mean Elastic Modulus EIT:      [uqudt:GigaPA]
                      Std Dev Elastic Modulus EIT:   [uqudt:GigaPA]
                      Mean Indentation Modulus Er:   [uqudt:GigaPA]
                      Std Dev Indentation Modulus Er: [uqudt:GigaPA]
                      Mean Reduced Modulus E*:       [uqudt:GigaPA]
                      Std Dev Reduced Modulus E*:    [uqudt:GigaPA]
                      Mean Vickers Equivalent HVIT:  [uqudt:UNITLESS]
                      Std Dev Vickers Equivalent HVIT: [uqudt:UNITLESS]
                      Mean Maximum Depth hmax:       [uqudt:MicroM]
                      Std Dev Maximum Depth hmax:    [uqudt:MicroM]
                      Number of Valid Indentations:  [uqudt:UNITLESS]
        default: []
