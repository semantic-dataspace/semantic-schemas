# OO-LD Schema for Nanoindentation Characterization Process (PMDCo / CHAMEO pattern)
#
# Inheritance chain:
#   nanoindentation/PMDCo
#     → characterization/generic/PMDCo  (allOf $ref)
#       → process-step/PMDCo            (allOf $ref)
#
# Fields inherited (do NOT redefine here):
#   process-step:    type, id, label, notes, date, operator, instrument,
#                    has_specified_input, has_specified_output, preceded_by
#   generic:         has_process_condition
#
# This schema adds only:
#   - type override          (chameo:Nanoindentation)
#   - has_specified_input    (KItem filter: nanoindentation-specimen/specimen/material)
#   - has_specified_output   (KItem filter: nanoindentation-dataset — summary/mean dataset)
#   - raw_data_files         (new: per-indent raw TXT files, prov:generated)
#   - Instrument setup fields
#   - Analysis settings
#   - Test environment conditions
#   - has_process_attribute  (test protocol parameters)
#   - measured_properties    (summary statistics)

"@context":
  # Nanoindentation-specific prefixes and term mappings only.
  # All process-step and characterization/generic terms are inherited
  # via allOf $ref and merged by the backend at RDF generation time.
  chameo:  "https://w3id.org/emmo/domain/characterisation-methodology/chameo#"
  nanoind: "https://w3id.org/emmo/domain/nanoindentation#"
  uqudt:   "http://qudt.org/vocab/unit/"
  obo:     "http://purl.obolibrary.org/obo/"
  # Instrument setup — DSMS nanoindentation vocabulary
  instrument_serial:
    "@id": "https://w3id.org/dsms/nanoindentation#instrumentSerialNumber"
  control_mode:
    "@id": "https://w3id.org/dsms/nanoindentation#controlMode"
  indenter_geometry:
    "@id": "https://w3id.org/dsms/nanoindentation#indenterGeometry"
  indenter_material:
    "@id": "https://w3id.org/dsms/nanoindentation#indenterMaterial"
  # Analysis settings
  analysis_method:
    "@id": "https://w3id.org/dsms/nanoindentation#analysisMethod"
  unload_fit_range:
    "@id": "https://w3id.org/dsms/nanoindentation#unloadFitRange"
  test_standard:
    "@id": "https://w3id.org/dsms/nanoindentation#testStandard"
  tip_area_function:
    "@id": "https://w3id.org/dsms/nanoindentation#tipAreaFunction"
  measured_properties:
    "@id": "http://purl.obolibrary.org/obo/OBI_0000299"
    "@container": "@set"
  is_about:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000136"
    "@type": "@id"
  has_value_spec:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001938"
  result_value:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001937"
    "@type": "xsd:double"
  result_unit:
    "@id": "http://purl.obolibrary.org/obo/IAO_0000039"
    "@type": "@id"
  specifies_value_of:
    "@id": "http://purl.obolibrary.org/obo/OBI_0001927"
    "@type": "@id"
  test_temperature:
    "@id": "https://w3id.org/dsms/characterization#testTemperature"
    "@type": "xsd:double"
  test_humidity:
    "@id": "https://w3id.org/dsms/characterization#testRelativeHumidity"
    "@type": "xsd:double"
  raw_data_files:
    "@id": "http://www.w3.org/ns/prov#generated"
    "@type": "@id"
    "@container": "@set"

allOf:
  - $ref: "../../../generic/PMDCo/specs/schema.oold.yaml"

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: PMDCo / CHAMEO pattern schema for a nanoindentation characterization process
x-schema-version: '0.1.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/nanoindentation-PMDCo-v0.1.0/schemas/characterization/nanoindentation/PMDCo/specs/schema.oold.generated.json'
x-maturity: 'draft'
x-process-step:
  category: characterization
title: Nanoindentation Characterization Process (PMDCo)
type: object

required:
  - type
  - id
  - label

properties:

  # ── Override: root type → chameo:Nanoindentation ───────────────────────────

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["chameo:Nanoindentation"]
    default: ["chameo:Nanoindentation"]
    options:
      enum_titles:
        - chameo:Nanoindentation

  # ── Override: narrow KItem filters for specimen / raw data linking ─────────

  has_specified_input:
    title: Specimen
    description: >-
      The specimen(s) or material(s) tested in this nanoindentation session.
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [nanoindentation-specimen, specimen, material]
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  has_specified_output:
    title: Summary Dataset
    description: >-
      The primary planned output of this nanoindentation session: an aggregated
      dataset containing mean/StdDev hardness (HIT), elastic modulus (EIT), etc.,
      derived from all valid indentations.
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [nanoindentation-dataset, dataset]
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  raw_data_files:
    title: Raw Measurement Files
    description: >-
      Individual per-indent raw data files generated by the instrument
      (one TXT / CSV per indentation). Generated data, not the primary planned
      result — link these via prov:generated.
    type: array
    format: kitem
    x-kitem:
      ktypeIds: [nanoindentation-dataset, dataset]
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  # ── Instrument Setup ───────────────────────────────────────────────────────

  instrument_serial:
    title: Instrument Serial Number
    type: string

  control_mode:
    title: Control Mode
    type: string
    enum:
      - Depth-controlled
      - Load-controlled
      - Constant Strain Rate
      - Oscillating (CSM)

  indenter_geometry:
    title: Indenter Geometry
    type: string
    enum:
      - Berkovich
      - Cube Corner
      - Spherical
      - Conical
      - Vickers
      - Flat Punch
      - Other

  indenter_material:
    title: Indenter Material
    type: string

  # ── Analysis Settings ──────────────────────────────────────────────────────

  analysis_method:
    title: Analysis Method
    type: string
    enum:
      - Oliver & Pharr
      - Doerner & Nix
      - ISO 14577
      - Continuous Stiffness (CSM)

  unload_fit_range:
    title: Unload Fit Range
    description: "e.g. [40%, 98%]"
    type: string

  test_standard:
    title: Test Standard
    description: "e.g. ISO 14577-1:2015, ASTM E2546"
    type: string

  tip_area_function:
    title: Tip Area Function Reference
    type: string

  # ── Test Environment (ISO 14577) ───────────────────────────────────────────

  test_temperature:
    title: Test Temperature (°C)
    description: "Ambient temperature during measurement. ISO 14577: 23 ± 5 °C."
    type: number

  test_humidity:
    title: Relative Humidity (%)
    description: "Ambient relative humidity during measurement. ISO 14577: 45 ± 10 %."
    type: number
    minimum: 0
    maximum: 100

  # ── Summary Statistics ─────────────────────────────────────────────────────

  measured_properties:
    title: Summary Statistics
    description: >-
      Aggregate results across all valid indentations.
      Each entry is a MeasurementDatum (IAO_0000109) with an embedded
      ScalarValueSpecification (OBI_0001931).
    type: array
    items:
      type: object
      title: Summary Result
      required:
        - type
        - id
        - label
        - has_value_spec
      properties:
        type:
          title: Type
          type: array
          items:
            type: string
          readOnly: true
          const: ["obo:IAO_0000109"]
          default: ["obo:IAO_0000109"]
          options:
            enum_titles:
              - iao:MeasurementDatum
        id:
          title: Datum ID
          type: string
          readOnly: true
          default: result-1-smd
        label:
          title: Result Name
          type: string
          enum:
            - Mean Hardness HIT
            - Std Dev Hardness HIT
            - Mean Elastic Modulus EIT
            - Std Dev Elastic Modulus EIT
            - Mean Maximum Depth hmax
            - Number of Valid Indentations
        has_value_spec:
          title: Value Specification
          type: object
          required:
            - type
            - id
            - result_value
            - result_unit
          properties:
            type:
              title: Type
              type: array
              items:
                type: string
              readOnly: true
              const: ["obo:OBI_0001931"]
              default: ["obo:OBI_0001931"]
              options:
                enum_titles:
                  - obi:ScalarValueSpecification
            id:
              title: Value Spec ID
              type: string
              readOnly: true
              default: result-1-svs
            result_value:
              title: Value
              type: number
              minimum: 0
            result_unit:
              title: Unit
              type: string
              enum:
                - uqudt:GigaPA
                - uqudt:MicroM
                - uqudt:UNITLESS
              options:
                enum_titles:
                  - GPa (gigapascal)
                  - "um (micrometre)"
                  - "- (count / dimensionless)"
              x-depends-on:
                field: label
                values:
                  Mean Hardness HIT:             [uqudt:GigaPA]
                  Std Dev Hardness HIT:          [uqudt:GigaPA]
                  Mean Elastic Modulus EIT:      [uqudt:GigaPA]
                  Std Dev Elastic Modulus EIT:   [uqudt:GigaPA]
                  Mean Maximum Depth hmax:       [uqudt:MicroM]
                  Number of Valid Indentations:  [uqudt:UNITLESS]
    default: []
