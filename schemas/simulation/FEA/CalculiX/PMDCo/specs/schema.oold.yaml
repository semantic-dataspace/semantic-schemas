# OO-LD Schema for FEA Simulation with CalculiX
# Ontology: OBI ComputerSimulation + PROV-O Activity
#   OBI_0000471: http://purl.obolibrary.org/obo/OBI_0000471
#   prov:Activity: http://www.w3.org/ns/prov#Activity
# This schema EXTENDS process-step/PMDCo via allOf + $ref.
# The @context declares only schema-specific entries; inherited entries from the base are
# merged automatically by the toolchain (see scripts/convert_to_json.py).
#
# Graph pattern:
#
#   ComputerSimulation + prov:Activity
#     rdfs:label ──────────────────────── name string
#     dcterms:description ─────────────── purpose/description string
#     dcterms:isPartOf ────────────────► project IRI
#     dcterms:created ─────────────────── run date (xsd:date)
#     prov:wasAssociatedWith ──────────► person IRI (single)
#     dcterms:subject ─────────────────── material system string
#     dcterms:type ────────────────────── FEA element type string
#     schema:softwareVersion ──────────── solver version string
#     fairsim:solverInvocation ───────── exact CLI command string
#     dcat:keyword ────────────────────── keyword strings [@container @set]
#     obi:0000293 ─────────────────────► input dataset IRIs
#     obi:0000299 ─────────────────────► output dataset IRIs
#     bfo:0000062 ─────────────────────► preceding process IRIs

"@context":
  dcat: "http://www.w3.org/ns/dcat#"
  fairsim: "https://w3id.org/pmd/fairsim/"
  obi:
    "@id": "http://purl.obolibrary.org/obo/OBI_"
    "@prefix": true
  bfo:
    "@id": "http://purl.obolibrary.org/obo/BFO_"
    "@prefix": true
  qudt: "http://qudt.org/schema/qudt/"
  conforms_to:
    "@id": "http://purl.org/dc/terms/conformsTo"
    "@type": "@id"
  purpose:
    "@id": "http://purl.org/dc/terms/description"
  project:
    "@id": "http://purl.org/dc/terms/isPartOf"
    "@type": "@id"
  date:
    "@id": "http://purl.org/dc/terms/created"
    "@type": "xsd:date"
  material_system:
    "@id": "http://purl.org/dc/terms/subject"
  element_type:
    "@id": "http://purl.org/dc/terms/type"
  solver_version:
    "@id": "https://schema.org/softwareVersion"
  solver_invocation:
    "@id": "https://w3id.org/pmd/fairsim/solverInvocation"
  keywords:
    "@id": "http://www.w3.org/ns/dcat#keyword"
    "@container": "@set"
$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: Schema for an FEA simulation step using CalculiX (OBI ComputerSimulation + PROV-O Activity)
x-schema-version: '0.1.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/simulation-FEA-CalculiX-PMDCo-v0.1.0/schemas/simulation/FEA/CalculiX/PMDCo/specs/schema.oold.generated.json'
x-maturity: 'draft'
x-process-step:
  category: simulation
x-schema-dependencies:
  - schema-id: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/process-step-PMDCo-v0.3.0/schemas/process-step/PMDCo/specs/schema.oold.generated.json'
    compatible-versions:
      - '0.3.0'
      - '0.3.1'
    property: (base schema via allOf)
title: FEA Simulation (CalculiX)
type: object

allOf:
  - $ref: "../../../../../process-step/PMDCo/specs/schema.oold.yaml"

required:
  - type
  - id
  - label

properties:

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["obi:0000471", "prov:Activity"]
    default: ["obi:0000471", "prov:Activity"]
    options:
      enum_titles:
        - obi:ComputerSimulation
        - prov:Activity

  id:
    title: ID
    description: IRI for this simulation instance.
    type: string
    readOnly: true
    default: fea-calculix-sim

  label:
    title: Simulation Name
    description: Human-readable name for this FEA simulation run.
    type: string

  purpose:
    title: Purpose
    description: Why this simulation was run; the scientific or engineering question it addresses.
    type: string
    format: textarea

  project:
    title: Project
    description: IRI of the project this simulation belongs to.
    type: string
    format: uri

  date:
    title: Date
    description: Date when the simulation was executed (YYYY-MM-DD).
    type: string
    format: date

  operator:
    title: Operator
    description: IRI of the person who ran or is responsible for this simulation.
    x-ktype: [expert]
    type: string
    format: uri

  material_system:
    title: Material System
    description: Free-text description of the material(s) simulated (e.g. "Copper + Steel structural").
    type: string

  element_type:
    title: Element Type
    description: FEA element type used in the mesh (e.g. "C3D20R", "S4R").
    type: string

  solver_version:
    title: Solver Version
    description: Version of the CalculiX solver (e.g. "2.20").
    type: string

  solver_invocation:
    title: Solver Invocation
    description: Exact command-line invocation used to run CalculiX.
    type: string

  keywords:
    title: Keywords
    description: Descriptive keywords for findability (e.g. FEM, cantilever, plasticity).
    type: array
    items:
      type: string
    uniqueItems: true
    default: []

  has_specified_input:
    title: Inputs
    description: Datasets or material nodes consumed by this simulation, referenced by IRI.
    type: array
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  has_specified_output:
    title: Outputs
    description: Datasets or result nodes produced by this simulation, referenced by IRI.
    type: array
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  preceded_by:
    title: Preceded By
    description: Steps that directly precede this one in the workflow, referenced by IRI.
    type: array
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []
