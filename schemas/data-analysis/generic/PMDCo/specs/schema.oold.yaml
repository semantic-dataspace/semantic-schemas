# OO-LD Schema for DataAnalysis (OBI DataTransformation pattern)
# Ontology: OBI (Ontology for Biomedical Investigations)
#   http://purl.obolibrary.org/obo/obi.owl
#
# OBI class hierarchy:
#   planned process (OBI_0000070)  ←── process-step/PMDCo base schema
#     └── data transformation (OBI_0200000)  ←── this schema
#
# This schema composes with process-step/PMDCo via allOf and overrides:
#   - type const  →  OBI_0200000 (DataTransformation)
#   - has_specified_input  x-oold-range  →  dataset only
#   - has_specified_output x-oold-range  →  dataset only
#   - operator title  →  "Analyst"
#   - id default  →  "data-analysis"
#
# All other fields (preceded_by, date, notes, instrument) are inherited
# unchanged from process-step/PMDCo.

$schema: "https://json-schema.org/draft/2020-12/schema"
$comment: Schema for an obi:DataTransformation (OBI_0200000) — a data analysis step
x-schema-version: '0.1.0'
x-schema-uri: 'https://raw.githubusercontent.com/semantic-dataspace/semantic-schemas/data-analysis-generic-PMDCo-v0.1.0/schemas/data-analysis/generic/PMDCo/specs/schema.oold.yaml'
x-maturity: 'draft'
x-process-step:
  category: data-analysis
title: Data Analysis
type: object

allOf:
  - $ref: "../../../../process-step/PMDCo/specs/schema.oold.yaml"

# obi: prefix needed for the OBI_0200000 type const below.
# All other context terms (has_specified_input, has_specified_output,
# preceded_by, operator, instrument) are inherited from the base schema.
"@context":
  obi:
    "@id": "http://purl.obolibrary.org/obo/OBI_"
    "@prefix": true
  conforms_to:
    "@id": "http://purl.org/dc/terms/conformsTo"
    "@type": "@id"

properties:

  type:
    title: Type
    type: array
    items:
      type: string
    readOnly: true
    const: ["obi:0200000"]
    default: ["obi:0200000"]
    options:
      enum_titles:
        - obi:DataTransformation

  id:
    title: ID
    description: Identifier for this data analysis instance; managed by the consumer.
    type: string
    readOnly: true
    default: data-analysis

  label:
    title: Analysis Name
    description: >-
      Human-readable name for this analysis step
      (e.g. "Yield strength evaluation", "Forming limit curve fitting").
    type: string

  has_specified_input:
    title: Input Datasets
    description: >-
      Dataset k-items consumed as input by this analysis step.
      Select the corresponding dataset entries from the knowledge graph.
    x-ktype: [dataset, dataset-catalog]
    type: array
    minItems: 1
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  has_specified_output:
    title: Output Datasets
    description: >-
      Dataset k-items produced as output by this analysis step.
      Select the corresponding entries from the knowledge graph.
    x-ktype: [dataset]
    type: array
    items:
      type: string
      format: uri
    uniqueItems: true
    default: []

  operator:
    title: Analyst
    description: Person who performed or supervised this analysis step.
    x-ktype: [expert]
    type: string
    format: uri
